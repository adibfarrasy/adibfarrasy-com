<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 205" role="img" aria-label="A sequence A B ... A. The second A matches the earlier A, attends to the token that followed it, B, and predicts B." style="min-width:860px"><g class="ve-n" transform="translate(20 100)" ><rect class="sh" width="70" height="44" rx="6"/><text x="35" y="22">...</text></g><g class="ve-n" transform="translate(130 100)" ><rect class="sh" width="70" height="44" rx="6"/><text x="35" y="22">A</text></g><g class="ve-n is-key" transform="translate(240 100)" ><rect class="sh" width="70" height="44" rx="6"/><text x="35" y="22">B</text></g><g class="ve-n" transform="translate(350 100)" ><rect class="sh" width="110" height="44" rx="6"/><text x="55" y="22">...</text></g><g class="ve-n" transform="translate(500 100)" ><rect class="sh" width="70" height="44" rx="6"/><text x="35" y="22">A</text></g><g class="ve-n is-key" transform="translate(640 100)" ><rect class="sh" width="150" height="44" rx="6"/><text x="75" y="22">predicts B</text></g><path class="ve-e is-hot" d="M535 100V50H275V98" /><text class="ve-el " x="405" y="42" >attends to what followed A</text><path class="ve-e is-async no-ah" d="M165 144V185H535V146" /><text class="ve-el " x="350" y="176" >A matches A</text><path class="ve-e " d="M570 122H640" /></svg></div><figcaption><span class="fig-n">Fig. 40</span>An induction head: if A B appeared earlier and A appears now, predict B. It appears suddenly during training and is a major mechanism behind in-context learning.</figcaption></figure>
