<figure><div class="cases"><div class="case" data-st="ok"><span class="chip info">bottom-up</span><h3>BPE</h3><svg class="ve-mini" viewBox="0 0 240 110" role="img" aria-label="BPE merges two small pieces into a bigger one."><g class="ve-n" transform="translate(20 6)" ><rect class="sh" width="90" height="34" rx="6"/><text x="45" y="17">u</text></g><g class="ve-n" transform="translate(130 6)" ><rect class="sh" width="90" height="34" rx="6"/><text x="45" y="17">g</text></g><path class="ve-e " d="M65 42V68" /><path class="ve-e " d="M175 42V68" /><g class="ve-n is-st" transform="translate(60 70)" ><rect class="sh" width="120" height="34" rx="6"/><text x="60" y="17">ug</text></g><text class="ve-el " x="120" y="56" >merge</text></svg><p class="meta">Merge the most frequent pair</p></div><div class="case" data-st="ok"><span class="chip info">bottom-up</span><h3>WordPiece</h3><svg class="ve-mini" viewBox="0 0 240 110" role="img" aria-label="WordPiece marks continuation pieces with a double hash."><g class="ve-n is-st" transform="translate(30 6)" ><rect class="sh" width="80" height="34" rx="6"/><text x="40" y="17">hug</text></g><g class="ve-n is-st" transform="translate(130 6)" ><rect class="sh" width="80" height="34" rx="6"/><text x="40" y="17">##s</text></g><text class="ve-tick " x="120" y="90" >merge by likelihood gain</text></svg><p class="meta">BERT. Merge what raises likelihood most: count(ab) / (count(a) count(b))</p></div><div class="case" data-st="ok"><span class="chip info">top-down</span><h3>Unigram LM</h3><svg class="ve-mini" viewBox="0 0 240 110" role="img" aria-label="Unigram starts large and prunes tokens."><g class="ve-n" transform="translate(10 6)" ><rect class="sh" width="220" height="34" rx="6"/><text x="110" y="17">large candidate set</text></g><path class="ve-e is-st" d="M120 42V68" /><text class="ve-el r" x="128" y="58" >prunes</text><g class="ve-n is-st" transform="translate(60 70)" ><rect class="sh" width="120" height="34" rx="6"/><text x="60" y="17">kept</text></g></svg><p class="meta">Drop tokens whose removal hurts likelihood least; allows subword regularization</p></div></div><figcaption><span class="fig-n">Fig. 10</span>Three ways to build a subword vocabulary.</figcaption></figure>
