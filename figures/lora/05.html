<figure class="ve-steps">
<div class="frame">
<svg class="ve-svg" viewBox="0 0 800 280" role="img" aria-label="Step one: at initialization A is random and B is zero, so the correction adds zero and the output equals W0 x. Step two: the gradient reaches B and is nonzero because A is random; the gradient for A is zero because B is zero. Step three: after one update B is nonzero, so the gradient also reaches A.">
<path class="ve-e" data-s="1" pathLength="1" d="M120 140H230"/><text class="ve-el" data-s="1" x="175" y="131">projects</text>
<path class="ve-e" data-s="1" pathLength="1" d="M360 140H440"/><text class="ve-el" data-s="1" x="400" y="131">Ax</text>
<path class="ve-e" data-s="1" pathLength="1" d="M570 140H650"/><text class="ve-el" data-s="1" x="610" y="131">adds 0</text>
<path class="ve-e is-hot" data-s="2" pathLength="1" d="M715 170V215H505V170"/><text class="ve-el" data-s="2" x="610" y="207">∂L/∂B ≠ 0</text>
<text class="ve-tick" data-s="2" x="295" y="94">∂L/∂A = 0</text>
<text class="ve-tick" data-s="3" x="505" y="94">B ≠ 0 now</text>
<path class="ve-e is-hot" data-s="3" pathLength="1" d="M715 170V250H295V170"/><text class="ve-el" data-s="3" x="400" y="241">∂L/∂A ≠ 0</text>
<g class="ve-n" data-s="1" transform="translate(20 110)"><rect class="sh" width="100" height="60" rx="6"/><text x="50" y="22">x</text><text class="sub" x="50" y="44">input</text></g>
<g class="ve-n is-key" data-s="1" transform="translate(230 110)"><rect class="sh" width="130" height="60" rx="6"/><text x="65" y="22">A</text><text class="sub" x="65" y="44">random</text></g>
<g class="ve-n is-key" data-s="1" transform="translate(440 110)"><rect class="sh" width="130" height="60" rx="6"/><text x="65" y="22">B</text><text class="sub" x="65" y="44">zero</text></g>
<g class="ve-n" data-s="1" transform="translate(650 110)"><rect class="sh" width="130" height="60" rx="6"/><text x="65" y="22">h</text><text class="sub" x="65" y="44">= W0 x</text></g>
</svg>
</div>
<div class="ve-player">
<ol class="ve-cap">
<li data-n="1/3">B = 0, so BA = 0: at step zero the layer outputs exactly W0 x, the pretrained behavior.</li>
<li data-n="2/3">Backward at step zero: B's gradient depends on Ax and A is random, so it is nonzero. A's gradient depends on B, so it is zero.</li>
<li data-n="3/3">After one step B is nonzero, so A gets gradients too. Initializing both to zero would leave both gradients zero forever.</li>
</ol>
<button data-go="-1" aria-label="Previous step">←</button>
<button data-play>Play</button>
<input type="range" min="0" value="0" aria-label="Step">
<button data-go="1" aria-label="Next step">→</button>
</div>
<figcaption><span class="fig-n">Fig. 5</span>One zero and one random matrix is the only start that is both safe and trainable.</figcaption>
</figure>
