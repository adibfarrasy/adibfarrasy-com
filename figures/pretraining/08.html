te(560 70)"><rect class="sh" width="80" height="60" rx="6"/><text x="40" y="22.2">Norm</text><text class="sub" x="40" y="43.8">final</text></g><g class="ve-n is-key" transform="translate(670 70)"><rect class="sh" width="130" height="60" rx="6"/><text x="65" y="22.2">Unembed</text><text class="sub" x="65" y="43.8">logits z</text></g><path class="ann" d="M100 214V240"/><g class="ve-co" transform="translate(100 252)"><circle r="11"/><text>1</text></g><path class="ann" d="M220 214V240"/><g class="ve-co" transform="translate(220 252)"><circle r="11"/><text>2</text></g><path class="ann" d="M480 214V240"/><g class="ve-co" transform="translate(480 252)"><circle r="11"/><text>3</text></g><path class="ann" d="M735 130V240"/><g class="ve-co" transform="translate(735 252)"><circle r="11"/><text>4</text></g></svg></div><figcaption><span class="fig-n">Fig. 8</span>Stability fixes are small and local: keep the residual stream a plain sum, and keep logit magnitudes bounded.</figcaption><ol class="callouts"><li><span class="co-n">1</span>Pre-norm: the norm sits inside the branch, so gradients flow straight through the stream. RMSNorm replaces LayerNorm; linear layers drop biases.</li><li><span class="co-n">2</span>QK-norm: normalize queries and keys per head before the dot product, so attention logits cannot grow without bound and softmax cannot saturate.</li><li><span class="co-n">3</span>Init: weights ~ N(0, 0.02) (or 1/√d). Branch output projections are further scaled by 1/√(2L), because the stream sums 2L branch outputs.</li><li><span class="co-n">4</span>z-loss: penalize (log Z)² on the output logits so bf16 round-off stays small. Cheap insurance against late divergence.</li></ol></figure>
