<figure><div class="cases"><div class="case" data-st="ok"><span class="chip ok">Correct pass</span><h3>Clean answer</h3><svg class="ve-mini" viewBox="0 0 240 156" role="img" aria-label="The response ends with 7. The last number matches gold 7, so reward is 10."><g class="ve-n" transform="translate(10 4)"><rect class="sh" width="220" height="30" rx="6"/><text x="110.0" y="15.0">so the answer is 7</text></g><path class="ve-e" d="M120 34V62"/><text class="ve-el r" x="128" y="50">last number</text><g class="ve-n" transform="translate(60 62)"><rect class="sh" width="120" height="30" rx="6"/><text x="60.0" y="15.0">7</text></g><path class="ve-e" d="M120 92V120"/><text class="ve-el r" x="128" y="108">= gold 7?</text><g class="ve-n is-st" transform="translate(60 120)"><rect class="sh" width="120" height="30" rx="6"/><text x="60.0" y="15.0">reward 10</text></g></svg><p>Only the final answer counts; reasoning is free-form.</p></div><div class="case" data-st="risk"><span class="chip risk">False fail</span><h3>Stray number</h3><svg class="ve-mini" viewBox="0 0 240 156" role="img" aria-label="The response ends with a footnote 3. The last number is 3, not gold 7, so reward is 0."><g class="ve-n" transform="translate(10 4)"><rect class="sh" width="220" height="30" rx="6"/><text x="110.0" y="15.0">answer is 7, see note 3</text></g><path class="ve-e" d="M120 34V62"/><text class="ve-el r" x="128" y="50">last number</text><g class="ve-n is-st" transform="translate(60 62)"><rect class="sh" width="120" height="30" rx="6"/><text x="60.0" y="15.0">3</text></g><path class="ve-e" d="M120 92V120"/><text class="ve-el r" x="128" y="108">= gold 7?</text><g class="ve-n is-st" transform="translate(60 120)"><rect class="sh" width="120" height="30" rx="6"/><text x="60.0" y="15.0">reward 0</text></g></svg><p>A right answer fails.</p></div><div class="case" data-st="warn"><span class="chip warn">False pass</span><h3>Guess list</h3><svg class="ve-mini" viewBox="0 0 240 156" role="img" aria-label="The response lists guesses ending in 7. The last number is 7, so reward is 10."><g class="ve-n" transform="translate(10 4)"><rect class="sh" width="220" height="30" rx="6"/><text x="110.0" y="15.0">maybe 3, 5, or 7</text></g><path class="ve-e" d="M120 34V62"/><text class="ve-el r" x="128" y="50">last number</text><g class="ve-n is-st" transform="translate(60 62)"><rect class="sh" width="120" height="30" rx="6"/><text x="60.0" y="15.0">7</text></g><path class="ve-e" d="M120 92V120"/><text class="ve-el r" x="128" y="108">= gold 7?</text><g class="ve-n is-st" transform="translate(60 120)"><rect class="sh" width="120" height="30" rx="6"/><text x="60.0" y="15.0">reward 10</text></g></svg><p>A hedged list passes.</p></div></div><figcaption><span class="fig-n">Fig. 28</span>The weakness of a last-number verifier. Real verifiers parse a designated format such as \boxed{} or "The answer is". Verifier bugs are a source of reward hacking too.</figcaption></figure>
