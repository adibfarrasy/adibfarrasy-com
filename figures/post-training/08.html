<figure><div class="cases"><div class="case" data-st="warn"><span class="chip warn">Wasted compute</span><h3>Padded batch</h3><svg class="ve-mini" viewBox="0 0 240 144" role="img" aria-label="Three examples of different length padded to the longest. Most of the batch is padding."><g class="ve-n" transform="translate(10 8)"><rect class="sh" width="216" height="30" rx="6"/><text x="108.0" y="15.0">A</text></g><g class="ve-n" transform="translate(10 46)"><rect class="sh" width="80" height="30" rx="6"/><text x="40.0" y="15.0">B</text></g><g class="ve-n" transform="translate(94 46)"><rect class="sh is-off" width="132" height="30" rx="6"/><text x="66.0" y="15.0"></text></g><g class="ve-n" transform="translate(10 84)"><rect class="sh" width="40" height="30" rx="6"/><text x="20.0" y="15.0">C</text></g><g class="ve-n" transform="translate(54 84)"><rect class="sh is-off" width="172" height="30" rx="6"/><text x="86.0" y="15.0"></text></g><text class="ve-tick" x="120" y="134">padding dominates</text></svg><p>Examples range from 50 to 4,000 tokens.</p></div><div class="case" data-st="risk"><span class="chip risk">Leaks context</span><h3>Naive packing</h3><svg class="ve-mini" viewBox="0 0 240 130" role="img" aria-label="Three examples packed into one sequence with no boundary mask. B attends to A."><g class="ve-n" transform="translate(10 52)"><rect class="sh" width="100" height="30" rx="6"/><text x="50.0" y="15.0">A</text></g><g class="ve-n" transform="translate(120 52)"><rect class="sh" width="60" height="30" rx="6"/><text x="30.0" y="15.0">B</text></g><g class="ve-n" transform="translate(190 52)"><rect class="sh" width="40" height="30" rx="6"/><text x="20.0" y="15.0">C</text></g><path class="ve-e is-st" d="M150 52V26H60V52"/><text class="ve-el" x="105" y="18">attends</text><text class="ve-tick" x="120" y="116">no boundary mask</text></svg><p>Unrelated context conditions B.</p></div><div class="case" data-st="ok"><span class="chip ok">Isolated</span><h3>Packing with resets</h3><svg class="ve-mini" viewBox="0 0 240 134" role="img" aria-label="Three packed examples with position ids reset at each boundary. Each attends only to itself."><g class="ve-n is-st" transform="translate(10 36)"><rect class="sh" width="100" height="30" rx="6"/><text x="50.0" y="15.0">A</text></g><g class="ve-n is-st" transform="translate(120 36)"><rect class="sh" width="60" height="30" rx="6"/><text x="30.0" y="15.0">B</text></g><g class="ve-n is-st" transform="translate(190 36)"><rect class="sh" width="40" height="30" rx="6"/><text x="20.0" y="15.0">C</text></g><path class="ve-grid" d="M115 28V74M185 28V74"/><text class="ve-tick" x="60" y="94">pos 0</text><text class="ve-tick" x="150" y="94">pos 0</text><text class="ve-tick" x="210" y="94">pos 0</text><text class="ve-tick" x="120" y="124">attends within block</text></svg><p>Reset positions, use a varlen attention kernel.</p></div></div><figcaption><span class="fig-n">Fig. 8</span>Packing fills each fixed-length sequence (say 4,096 tokens). It is free only with per-example masking and position resets.</figcaption></figure>
