<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 800 240" role="img" aria-label="Lineage of optimizers. SGD gains momentum, which smooths the gradient. AdaGrad becomes RMSProp by forgetting old squared gradients. Momentum and RMSProp combine into Adam. Adam becomes AdamW by decoupling weight decay. For 2D weights, Muon replaces the per-coordinate scale with a whole-matrix update."><path class="ve-e" d="M140 62H220"/><text class="ve-el" x="180" y="50">smooths</text><path class="ve-e" d="M360 62H440"/><text class="ve-el" x="400" y="50">scales</text><path class="ve-e" d="M580 62H660"/><text class="ve-el" x="620" y="50">decays</text><path class="ve-e" d="M140 182H220"/><text class="ve-el" x="180" y="170">forgets</text><path class="ve-e is-hot" d="M360 182H510V94"/><text class="ve-el" x="435" y="170">divides by √v</text><path class="ve-e is-async" d="M730 94V150"/><text class="ve-el l" x="722" y="128">2D weights</text><g class="ve-n" transform="translate(0 30)"><rect class="sh" width="140" height="64" rx="6"/><text x="70" y="23.7">SGD</text><text class="sub" x="70" y="46.1">u = g</text></g><g class="ve-n" transform="translate(220 30)"><rect class="sh" width="140" height="64" rx="6"/><text x="70" y="23.7">Momentum</text><text class="sub" x="70" y="46.1">EMA of g</text></g><g class="ve-n is-key" transform="translate(440 30)"><rect class="sh" width="140" height="64" rx="6"/><text x="70" y="23.7">Adam</text><text class="sub" x="70" y="46.1">m over √v</text></g><g class="ve-n is-key" transform="translate(660 30)"><rect class="sh" width="140" height="64" rx="6"/><text x="70" y="23.7">AdamW</text><text class="sub" x="70" y="46.1">decoupled decay</text></g><g class="ve-n" transform="translate(0 150)"><rect class="sh" width="140" height="64" rx="6"/><text x="70" y="23.7">AdaGrad</text><text class="sub" x="70" y="46.1">sum of g²</text></g><g class="ve-n" transform="translate(220 150)"><rect class="sh" width="140" height="64" rx="6"/><text x="70" y="23.7">RMSProp</text><text class="sub" x="70" y="46.1">EMA of g²</text></g><g class="ve-n" transform="translate(660 150)"><rect class="sh" width="140" height="64" rx="6"/><text x="70" y="23.7">Muon</text><text class="sub" x="70" y="46.1">whole matrix</text></g></svg></div><figcaption><span class="fig-n">Fig. 1</span>Each arrow is one fix. Adam combines the two lines; AdamW fixes its decay; Muon changes what the update is built from.</figcaption></figure>
