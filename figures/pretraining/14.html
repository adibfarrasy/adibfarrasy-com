<figure class="ve-steps"><div class="frame"><svg class="ve-svg" viewBox="0 0 800 216" role="img" aria-label="Data pipeline from Common Crawl to a training mixture: crawl, extract text and identify language, apply rule filters, apply a quality classifier, deduplicate, then mix. The classifier keeps 1.3 trillion of 15 trillion FineWeb tokens as FineWeb-Edu."><path class="ve-e" data-s="2" pathLength="1" d="M108 52H138.4"/><g class="ve-n" data-s="1" transform="translate(0 20)"><rect class="sh" width="108" height="64" rx="6"/><text x="54" y="23.7">Crawl</text><text class="sub" x="54" y="46.7">WARC pages</text></g><path class="ve-e" data-s="3" pathLength="1" d="M246.4 52H276.8"/><g class="ve-n" data-s="2" transform="translate(138.4 20)"><rect class="sh" width="108" height="64" rx="6"/><text x="54" y="23.7">Extract</text><text class="sub" x="54" y="46.7">+ lang id</text></g><path class="ve-e" data-s="4" pathLength="1" d="M384.8 52H415.2"/><g class="ve-n" data-s="3" transform="translate(276.8 20)"><rect class="sh" width="108" height="64" rx="6"/><text x="54" y="23.7">Rules</text><text class="sub" x="54" y="46.7">Gopher, C4</text></g><path class="ve-e" data-s="5" pathLength="1" d="M523.2 52H553.6"/><g class="ve-n is-key" data-s="4" transform="translate(415.2 20)"><rect class="sh" width="108" height="64" rx="6"/><text x="54" y="23.7">Classifier</text><text class="sub" x="54" y="46.7">score 3+</text></g><path class="ve-e" data-s="6" pathLength="1" d="M661.6 52H692"/><g class="ve-n" data-s="5" transform="translate(553.6 20)"><rect class="sh" width="108" height="64" rx="6"/><text x="54" y="23.7">Dedup</text><text class="sub" x="54" y="46.7">MinHash</text></g><g class="ve-n" data-s="6" transform="translate(692 20)"><rect class="sh" width="108" height="64" rx="6"/><text x="54" y="23.7">Mix</text><text class="sub" x="54" y="46.7">50/25/17/8</text></g><text class="ve-tick l" data-s="4" x="0" y="124">FineWeb, 96 snapshots: 15T tokens</text><rect class="ve-bar" data-s="4" x="0" y="134" width="720" height="16" rx="2"/><text class="ve-bar-v" data-s="4" x="728" y="142">15T</text><text class="ve-tick l" data-s="4" x="0" y="178">FineWeb-Edu, score 3 and up: 1.3T tokens</text><rect class="ve-bar hot" data-s="4" x="0" y="188" width="62.4" height="16" rx="2"/><text class="ve-bar-v" data-s="4" x="70.4" y="196">1.3T</text></svg></div><div class="ve-player"><ol class="ve-cap"><li data-n="1/6"><b>Crawl.</b> Common Crawl publishes WARC (raw HTML) and WET (crude text) snapshots every month or two. WET keeps menus and footers, so serious pipelines re-extract from WARC.</li><li data-n="2/6"><b>Extract and identify language.</b> trafilatura or resiliparse keep the main content. A fastText model labels 176 languages; English pipelines keep score above ~0.65.</li><li data-n="3/6"><b>Rules</b> cut obvious junk: 50 to 100,000 words, mean word length 3 to 10, symbol-to-word ratio under 0.1, 80%+ of words with a letter, some stopwords, low repetition, C4&#39;s terminal-punctuation rule, URL blocklists.</li><li data-n="4/6"><b>A classifier finds good text.</b> FineWeb-Edu has Llama 3 70B grade 450K documents 0 to 5 for educational value, trains a small classifier, and keeps score 3 and up.</li><li data-n="5/6"><b>Dedup</b> removes exact copies, long repeated spans and near-duplicates. Do it within each snapshot, not across all of them.</li><li data-n="6/6"><b>Mask PII, filter toxicity conservatively, then mix.</b> The mixture is the sampling probability of each pool.</li></ol><button data-go="-1" aria-label="Previous step">←</button><button data-play>Play</button><input type="range" min="0" value="0" aria-label="Step"><button data-go="1" aria-label="Next step">→</button></div><figcaption><span class="fig-n">Fig. 14</span>Petabytes in, a few trillion good tokens out. Each stage is a filter with an ablation behind it.</figcaption></figure>
