rect class="ve-bar" x="410" y="141" width="62" height="18" rx="2" data-s="3"/><text class="ve-bar-v" x="480" y="150" data-s="3">0.31</text><g class="ve-n" transform="translate(620 128)" data-s="1" data-ref="v"><rect class="sh" width="110" height="44" rx="6"/><text x="55" y="22">v · cat</text></g><path class="ve-e " d="M730 150H770V150H830" data-s="4" pathLength="1"/><g class="ve-n" transform="translate(230 218)" data-s="1" data-ref="k"><rect class="sh" width="110" height="44" rx="6"/><text x="55" y="22">k · sat</text></g><path class="ve-e " d="M150 150H190V240H230" data-s="2" pathLength="1" data-ref="q k"/><text class="ve-el " x="205" y="230" data-s="2">3.0</text><path class="ve-e " d="M340 240H400" data-s="3" pathLength="1"/><rect class="ve-bar hot" x="410" y="231" width="102" height="18" rx="2" data-s="3"/><text class="ve-bar-v" x="520" y="240" data-s="3">0.51</text><g class="ve-n" transform="translate(620 218)" data-s="1" data-ref="v"><rect class="sh" width="110" height="44" rx="6"/><text x="55" y="22">v · sat</text></g><path class="ve-e no-ah" d="M730 240H770V150H830" data-s="4" pathLength="1"/><text class="ve-el " x="752" y="52" data-s="4">× w</text><text class="ve-el " x="752" y="142" data-s="4">× w</text><text class="ve-el " x="752" y="232" data-s="4">× w</text><g class="ve-n is-key" transform="translate(830 120)" data-s="4"><rect class="sh" width="150" height="60" rx="6"/><text x="75" y="19">out · sat</text><text class="sub" x="75" y="41">Σ w · v</text></g></svg></div><div class="ve-player"><ol class="ve-cap"><li data-n="1/4">The token sat makes a <span class="ve-ref" data-ref="q" tabindex="0">query</span>. Every token also makes a <span class="ve-ref" data-ref="k" tabindex="0">key</span> and a <span class="ve-ref" data-ref="v" tabindex="0">value</span>.</li><li data-n="2/4">Dot the query with each key. A bigger score means a better match.</li><li data-n="3/4">Divide by \(\sqrt{d_k}\) (here \(\sqrt{4}=2\)), then softmax: weights are positive and sum to 1.</li><li data-n="4/4">The output is the weighted sum of the value vectors: sat reads about half from itself.</li></ol><button data-go="-1" aria-label="Previous step">←</button><button data-play>Play</button><input type="range" min="0" value="0" aria-label="Step"><button data-go="1" aria-label="Next step">→</button></div><figcaption><span class="fig-n">Fig. 25</span>One query, three keys. The highest score gets about half the weight.</figcaption></figure>
