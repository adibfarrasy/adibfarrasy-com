ont-weight:600">bf16</text><rect x="90" y="152" width="20" height="40" rx="2" style="fill:var(--border-bright);stroke:var(--bg);stroke-width:2"/><text x="100" y="172" style="fill:var(--bg);font:600 14px var(--font-mono);text-anchor:middle;dominant-baseline:central">S</text><rect x="110" y="152" width="160" height="40" rx="2" style="fill:var(--accent);stroke:var(--bg);stroke-width:2"/><text x="190" y="172" style="fill:var(--bg);font:600 14px var(--font-mono);text-anchor:middle;dominant-baseline:central">exp 8</text><rect x="270" y="152" width="140" height="40" rx="2" style="fill:var(--info);stroke:var(--bg);stroke-width:2"/><text x="340" y="172" style="fill:var(--bg);font:600 14px var(--font-mono);text-anchor:middle;dominant-baseline:central">mantissa 7</text><g class="ve-dim is-key"><path class="ln" d="M110 24H270"/><text x="190" y="17">same range as fp32: 8 exponent bits</text></g></svg></div><figcaption><span class="fig-n">Fig. 23</span>bf16 keeps fp32&#39;s 8 exponent bits, so no overflow and no loss scaling. It pays in mantissa bits, so master weights stay fp32.</figcaption></figure>
