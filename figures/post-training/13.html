<figure class="ve-steps"><div class="frame"><svg class="ve-svg" viewBox="0 0 800 290" role="img" aria-label="DPO derivation in five boxes: the RLHF objective has an optimal policy; inverting it expresses the reward through the policy plus a log Z term; in Bradley-Terry the log Z terms cancel; the result is the DPO loss."><g class="ve-n" data-s="1" transform="translate(20 30)"><rect class="sh" width="200" height="80" rx="6"/><text x="100.0" y="30.0">RLHF objective</text><text class="sub" x="100.0" y="50.0">max E[r] − β KL</text></g><path class="ve-e" data-s="2" pathLength="1" d="M220 70H290"/><text class="ve-el" data-s="2" x="255" y="58">solves</text><g class="ve-n" data-s="2" transform="translate(290 30)"><rect class="sh" width="200" height="80" rx="6"/><text x="100.0" y="30.0">Optimal policy</text><text class="sub" x="100.0" y="50.0">πref · e^(r/β) / Z</text></g><g class="ve-co" data-s="2" transform="translate(470 14)"><circle r="11"/><text>1</text></g><path class="ann" data-s="2" d="M470 25V30"/><path class="ve-e" data-s="3" pathLength="1" d="M490 70H560"/><text class="ve-el" data-s="3" x="525" y="58">inverts</text><g class="ve-n" data-s="3" transform="translate(560 30)"><rect class="sh" width="200" height="80" rx="6"/><text x="100.0" y="20.0">Implicit reward</text><text class="sub" x="100.0" y="40.0">β log (π / πref)</text><text class="sub" x="100.0" y="60.0">+ β log Z</text></g><path class="ve-e" data-s="4" pathLength="1" d="M670 110V190"/><text class="ve-el r" data-s="4" x="678" y="150">plugs into</text><g class="ve-n" data-s="4" transform="translate(580 190)"><rect class="sh" width="180" height="80" rx="6"/><text x="90.0" y="30.0">Bradley-Terry</text><text class="sub" x="90.0" y="50.0">needs r(yw) − r(yl)</text></g><path class="ve-e is-hot" data-s="5" pathLength="1" d="M580 230H480"/><text class="ve-el" data-s="5" x="530" y="218">Z cancels</text><g class="ve-n is-key" data-s="5" transform="translate(280 190)"><rect class="sh" width="200" height="80" rx="6"/><text x="100.0" y="30.0">DPO loss</text><text class="sub" x="100.0" y="50.0">−log σ(β Δ log-ratio)</text></g><g class="ve-co" data-s="5" transform="translate(530 258)"><circle r="11"/><text>2</text></g><path class="ann" data-s="5" d="M530 236V247"/></svg></div><div class="ve-player"><ol class="ve-cap"><li data-n="1/5">Start from the KL-regularized RLHF objective for one prompt.</li><li data-n="2/5">Fold the reward into the log and normalize with \(Z(x)\). The objective becomes \(-\beta\, \mathrm{KL}[\pi \,\|\, \pi^*]\) plus a constant, so the maximum is at \(\pi^*\).</li><li data-n="3/5">Invert it: every reward equals \(\beta \log(\pi^*/\pi_{\text{ref}}) + \beta \log Z(x)\). \(Z(x)\) is still intractable.</li><li data-n="4/5">Plug into Bradley-Terry. It only uses a difference of rewards for one prompt.</li><li data-n="5/5">The \(\beta \log Z(x)\) terms cancel. Fit by maximum likelihood: the RM loss with the policy's implicit reward.</li></ol><button data-go="-1" aria-label="Previous step">&larr;</button><button data-play>Play</button><input type="range" min="0" value="0" aria-label="Step"><button data-go="1" aria-label="Next step">&rarr;</button></div><figcaption><span class="fig-n">Fig. 13</span>The derivation in one picture: the intractable partition function appears, then cancels.</figcaption><ol class="callouts"><li><span class="co-n">1</span>\(Z(x)\) sums over every possible response, so \(\pi^*\) cannot be used to sample.</li><li><span class="co-n">2</span>\(Z(x)\) depends only on the prompt, so it cancels in a difference of two rewards for the same prompt.</li></ol></figure>
