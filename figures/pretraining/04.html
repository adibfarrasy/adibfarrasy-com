<figure><div class="cases"><div class="case" data-st="warn"><span class="chip warn">Base model</span><h3>Completes the document</h3><svg class="ve-mini" viewBox="0 0 240 126" role="img" aria-label="Base model: the prompt &quot;Capital of France?&quot; is continued with more quiz questions."><g class="ve-n" transform="translate(20 6)"><rect class="sh" width="200" height="34" rx="6"/><text x="100" y="17">Capital of France?</text></g><path class="ve-e is-st" d="M120 40V66"/><text class="ve-el r" x="128" y="58">continues</text><g class="ve-n is-st" transform="translate(20 68)"><rect class="sh" width="200" height="50" rx="6"/><text x="100" y="18.5">more quiz lines</text><text class="sub" x="100" y="36.5">a list is plausible</text></g></svg></div><div class="case" data-st="ok"><span class="chip ok">Chat model</span><h3>Follows the instruction</h3><svg class="ve-mini" viewBox="0 0 240 126" role="img" aria-label="Chat model: the same prompt is answered and the reply stops."><g class="ve-n" transform="translate(20 6)"><rect class="sh" width="200" height="34" rx="6"/><text x="100" y="17">Capital of France?</text></g><path class="ve-e is-st" d="M120 40V66"/><text class="ve-el r" x="128" y="58">answers</text><g class="ve-n is-st" transform="translate(20 68)"><rect class="sh" width="200" height="50" rx="6"/><text x="100" y="18.5">Paris. [stop]</text><text class="sub" x="100" y="36.5">follows the template</text></g></svg></div><div class="case" data-st="ok"><span class="chip info">Why it matters</span><h3>Post-training is thin</h3><svg class="ve-mini" viewBox="0 0 240 126" role="img" aria-label="Post-training uses millions of tokens against trillions in pretraining (log scale)."><text class="ve-tick l" x="20" y="14">pretraining: trillions</text><rect class="ve-bar hot" x="20" y="24" width="200" height="18" rx="2"/><text class="ve-tick l" x="20" y="66">post-training: millions</text><rect class="ve-bar" x="20" y="76" width="100" height="18" rx="2"/><text class="ve-tick" x="120" y="108">log scale</text></svg><p>It reshapes existing skill. It cannot install knowledge the base never saw.</p></div></div><figcaption><span class="fig-n">Fig. 4</span>Same prompt, different behavior: post-training sets how the model answers, pretraining sets what it can do.</figcaption></figure>
