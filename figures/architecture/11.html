<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 220" role="img" aria-label="Vocabulary sizes: Llama 2 32 thousand, GPT-2 50 thousand, cl100k about 100 thousand, Llama 3 128 thousand, o200k about 200 thousand." style="min-width:860px"><text class="ve-tick l" x="20" y="34" >Llama 2</text><rect class="ve-bar" x="140" y="20" width="99.2" height="28" rx="2" /><text class="ve-bar-v" x="247.2" y="34" >32k</text><text class="ve-tick l" x="20" y="74" >GPT-2</text><rect class="ve-bar" x="140" y="60" width="155.8" height="28" rx="2" /><text class="ve-bar-v" x="303.8" y="74" >50k</text><text class="ve-tick l" x="20" y="114" >cl100k</text><rect class="ve-bar" x="140" y="100" width="310" height="28" rx="2" /><text class="ve-bar-v" x="458" y="114" >about 100k</text><text class="ve-tick l" x="20" y="154" >Llama 3</text><rect class="ve-bar" x="140" y="140" width="396.8" height="28" rx="2" /><text class="ve-bar-v" x="544.8" y="154" >128k</text><text class="ve-tick l" x="20" y="194" >o200k</text><rect class="ve-bar hot" x="140" y="180" width="620" height="28" rx="2" /><text class="ve-bar-v" x="768" y="194" >about 200k</text></svg></div><figcaption><span class="fig-n">Fig. 11</span>Vocabulary size keeps rising. A bigger vocabulary gives shorter sequences and better coverage of code and other languages. It costs \(V \times d_{\text{model}}\) parameters in the input embedding and again in the output layer, and rare tokens get few training examples.</figcaption></figure>
