<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 335" role="img" aria-label="Four linear weights are transposed when copying from the Hugging Face checkpoint: c_attn, attn.c_proj, mlp.c_fc and mlp.c_proj. Embeddings, LayerNorm weights and biases are copied as is. The attn.bias mask buffers are skipped." style="min-width:860px"><text class="ve-tick l" x="20" y="16" >HF checkpoint (Conv1D: in, out)</text><text class="ve-tick l" x="580" y="16" >our model (nn.Linear: out, in)</text><g class="ve-n" transform="translate(20 30)" ><rect class="sh" width="340" height="38" rx="6"/><text x="170" y="19">c_attn.weight  (768, 2304)</text></g><g class="ve-n is-key" transform="translate(580 30)" ><rect class="sh" width="200" height="38" rx="6"/><text x="100" y="19">(2304, 768)</text></g><path class="ve-e is-hot" d="M360 49H580" /><text class="ve-el " x="470" y="38" >transposes</text><g class="ve-n" transform="translate(20 80)" ><rect class="sh" width="340" height="38" rx="6"/><text x="170" y="19">attn.c_proj.weight  (768, 768)</text></g><g class="ve-n is-key" transform="translate(580 80)" ><rect class="sh" width="200" height="38" rx="6"/><text x="100" y="19">(768, 768)</text></g><path class="ve-e is-hot" d="M360 99H580" /><text class="ve-el " x="470" y="88" >transposes</text><g class="ve-n" transform="translate(20 130)" ><rect class="sh" width="340" height="38" rx="6"/><text x="170" y="19">mlp.c_fc.weight  (768, 3072)</text></g><g class="ve-n is-key" transform="translate(580 130)" ><rect class="sh" width="200" height="38" rx="6"/><text x="100" y="19">(3072, 768)</text></g><path class="ve-e is-hot" d="M360 149H580" /><text class="ve-el " x="470" y="138" >transposes</text><g class="ve-n" transform="translate(20 180)" ><rect class="sh" width="340" height="38" rx="6"/><text x="170" y="19">mlp.c_proj.weight  (3072, 768)</text></g><g class="ve-n is-key" transform="translate(580 180)" ><rect class="sh" width="200" height="38" rx="6"/><text x="100" y="19">(768, 3072)</text></g><path class="ve-e is-hot" d="M360 199H580" /><text class="ve-el " x="470" y="188" >transposes</text><g class="ve-n" transform="translate(20 230)" ><rect class="sh" width="340" height="38" rx="6"/><text x="170" y="19">wte, wpe, LayerNorm, biases</text></g><g class="ve-n" transform="translate(580 230)" ><rect class="sh" width="200" height="38" rx="6"/><text x="100" y="19">same shape</text></g><path class="ve-e " d="M360 249H580" /><text class="ve-el " x="470" y="238" >copies</text><g class="ve-n" transform="translate(20 280)" ><rect class="sh" width="340" height="38" rx="6"/><text x="170" y="19">attn.bias, attn.masked_bias</text></g><g class="ve-n" transform="translate(580 280)" ><rect class="sh is-off" width="200" height="38" rx="6"/><text x="100" y="19">not copied</text></g><path class="ve-e is-async" d="M360 299H580" /><text class="ve-el " x="470" y="288" >skips</text></svg></div><figcaption><span class="fig-n">Fig. 44</span>Loading the official weights. OpenAI stored linear layers as Conv1D with shape (in, out); <code>nn.Linear</code> wants (out, in). A shape assertion guards each copy. HF's <code>attn.bias</code> mask buffers (not the <code>c_attn.bias</code> weights) are skipped because our model builds its own mask.</figcaption></figure>
