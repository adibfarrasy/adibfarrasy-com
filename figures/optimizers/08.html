<figure><div class="cases"><div class="case" data-st="warn"><span class="chip warn">ε too large</span><h3>Adam turns into SGD</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="Bars: root of v-hat is smaller than epsilon, so the update is about m-hat over epsilon."><rect class="ve-bar" x="50" y="56" width="50" height="12" rx="2"/><rect class="ve-bar hot" x="150" y="32" width="50" height="36" rx="2"/><path class="ve-grid" d="M20 68H220"/><text class="ve-tick" x="75" y="92">√v̂</text><text class="ve-tick" x="175" y="92">ε</text><text class="ve-el" x="120" y="114">update ≈ m̂/ε</text></svg><p>When √v̂ ≪ ε the update is m̂/ε: momentum SGD with rate η/ε.</p></div><div class="case" data-st="risk"><span class="chip risk">β₂ = 0.999</span><h3>Slow to notice a spike</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="Averaging window: 0.999 averages about 1000 steps, 0.95 about 20."><rect class="ve-bar" x="20" y="22" width="200" height="20" rx="2"/><rect class="ve-bar hot" x="20" y="62" width="4" height="20" rx="2"/><text class="ve-tick" x="120" y="56">0.999: ~1000 steps</text><text class="ve-tick" x="120" y="104">0.95: ~20 steps</text></svg><p>A sudden gradient jump overshoots for hundreds of steps.</p></div><div class="case" data-st="ok"><span class="chip ok">Clipping</span><h3>One bad batch cannot poison m, v</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="A long gradient vector is rescaled to a circle of radius c."><circle class="ann" cx="90" cy="52" r="34" fill="none"/><path class="ve-e no-ah" d="M90 52L172 10" stroke-dasharray="4 4"/><path class="ve-e is-st" d="M90 52L120 37"/><text class="ve-el" x="120" y="112">g × min(1, c/‖g‖)</text></svg><p>Rescale g if its global norm exceeds c (1.0 is standard).</p></div></div><figcaption><span class="fig-n">Fig. 8</span>The three stability knobs. Defaults of \(10^{-8}\) for \(\epsilon\) suit most LLMs; some large-scale recipes go much smaller.</figcaption></figure>
