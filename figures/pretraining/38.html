<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 800 270" role="img" aria-label="Llama 3 interruptions in a 54-day snapshot: 466 in total, 47 planned and 419 unexpected. Faulty GPUs caused 30.1 percent of the unexpected ones, GPU HBM3 memory 17.2 percent, and confirmed or suspected hardware issues about 78 percent in all."><rect x="20" y="50" width="72.6" height="40" rx="2" style="fill:var(--info);stroke:var(--bg);stroke-width:2"/><rect x="92.6" y="50" width="647.4" height="40" rx="2" style="fill:var(--accent);stroke:var(--bg);stroke-width:2"/><text x="416.3" y="70" style="fill:var(--bg);font:600 14px var(--font-mono);text-anchor:middle;dominant-baseline:central">419 unexpected</text><text class="ve-tick" x="76.3" y="42">47 planned</text><text class="ve-tick l" x="20" y="14">466 interruptions in 54 days</text><text class="ve-tick l" x="0" y="152">faulty GPUs</text><rect x="250" y="134" width="132.4" height="28" rx="2" style="fill:var(--accent);stroke:var(--bg);stroke-width:2"/><text class="ve-bar-v" x="390.4" y="148">30.1%</text><text class="ve-tick l" x="0" y="194">GPU HBM3 memory</text><rect x="250" y="176" width="75.7" height="28" rx="2" style="fill:var(--accent);stroke:var(--bg);stroke-width:2"/><text class="ve-bar-v" x="333.7" y="190">17.2%</text><text class="ve-tick l" x="0" y="236">all hardware, any cause</text><rect x="250" y="218" width="343.2" height="28" rx="2" style="fill:var(--border-bright);stroke:var(--bg);stroke-width:2"/><text class="ve-bar-v" x="601.2" y="232">78% incl. suspected</text><text class="ve-tick l" x="250" y="122">share of the 419 unexpected</text></svg></div><figcaption><span class="fig-n">Fig. 38</span>At this scale failure is a statistical certainty. Software bugs, switches, cables and host maintenance made up much of the rest.</figcaption></figure>
