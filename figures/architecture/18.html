<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 245" role="img" aria-label="Without position, dog bites man and man bites dog give the same three vectors, only reordered. With position vectors added, each token&#x27;s vector differs between the two sentences." style="min-width:860px"><g class="ve-zone"><rect x="10" y="6" width="400" height="230" rx="8"/><text x="22" y="28">NO POSITION</text></g><g class="ve-zone"><rect x="540" y="6" width="450" height="230" rx="8"/><text x="552" y="28">WITH POSITION</text></g><g class="ve-n" transform="translate(25 50)" ><rect class="sh" width="110" height="40" rx="6"/><text x="55" y="20">dog</text></g><g class="ve-n" transform="translate(25 170)" ><rect class="sh" width="110" height="40" rx="6"/><text x="55" y="20">man</text></g><g class="ve-n" transform="translate(150 50)" ><rect class="sh" width="110" height="40" rx="6"/><text x="55" y="20">bites</text></g><g class="ve-n" transform="translate(150 170)" ><rect class="sh" width="110" height="40" rx="6"/><text x="55" y="20">bites</text></g><g class="ve-n" transform="translate(275 50)" ><rect class="sh" width="110" height="40" rx="6"/><text x="55" y="20">man</text></g><g class="ve-n" transform="translate(275 170)" ><rect class="sh" width="110" height="40" rx="6"/><text x="55" y="20">dog</text></g><path class="ve-e is-hot no-ah" d="M80 90L330 170" /><path class="ve-e is-hot no-ah" d="M205 90L205 170" /><path class="ve-e is-hot no-ah" d="M330 90L80 170" /><text class="ve-el " x="205" y="134" >same vectors</text><g class="ve-n" transform="translate(555 50)" ><rect class="sh" width="125" height="40" rx="6"/><text x="62.5" y="20">dog + p0</text></g><g class="ve-n is-key" transform="translate(555 170)" ><rect class="sh" width="125" height="40" rx="6"/><text x="62.5" y="20">man + p0</text></g><g class="ve-n" transform="translate(695 50)" ><rect class="sh" width="125" height="40" rx="6"/><text x="62.5" y="20">bites + p1</text></g><g class="ve-n" transform="translate(695 170)" ><rect class="sh" width="125" height="40" rx="6"/><text x="62.5" y="20">bites + p1</text></g><g class="ve-n" transform="translate(835 50)" ><rect class="sh" width="125" height="40" rx="6"/><text x="62.5" y="20">man + p2</text></g><g class="ve-n is-key" transform="translate(835 170)" ><rect class="sh" width="125" height="40" rx="6"/><text x="62.5" y="20">dog + p2</text></g><text class="ve-tick " x="765" y="134" >the vectors now differ</text></svg></div><figcaption><span class="fig-n">Fig. 18</span>Attention is permutation equivariant: shuffle the input and the outputs are shuffled the same way. The model needs position information injected, either added to the embedding (absolute) or built into the score so it depends on distance (relative).</figcaption></figure>
