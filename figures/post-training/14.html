<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 800 285" role="img" aria-label="A schematic of DPO training. The log-probability of both the chosen and the rejected response falls over training steps, the rejected one faster, so the margin between them grows."><path class="ve-grid" d="M80 30V240"/><path class="ve-grid" d="M80 240H720"/><path class="ve-e no-ah" d="M80 90C240 98 420 108 620 122"/><path class="ve-e no-ah is-hot" d="M80 100C240 128 420 165 620 200"/><text class="ve-el l" x="600" y="108">chosen</text><text class="ve-el l" x="600" y="216">rejected</text><path class="ve-grid" d="M620 122H655M620 200H655"/><g class="ve-dim is-key"><path class="ln" d="M650 122V200"/><text x="706" y="165">margin grows</text></g><g class="ve-co" transform="translate(360 74)"><circle r="11"/><text>1</text></g><path class="ann" d="M360 85V98"/><text class="ve-tick" x="400" y="264">training steps</text><text class="ve-tick l" x="20" y="22">log-prob of the response</text><text class="ve-tick l" x="520" y="22">schematic, not measured</text></svg></div><figcaption><span class="fig-n">Fig. 14</span>During DPO both log-probabilities often fall. The margin grows because the rejected one falls faster.</figcaption><ol class="callouts"><li><span class="co-n">1</span>Only the margin is guaranteed to grow. Large drops in both are a warning: probability mass leaks to responses in neither set.</li></ol></figure>
