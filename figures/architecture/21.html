<figure><div class="cases"><div class="case" data-st="ok"><span class="chip info">absolute, learned</span><h3>Learned (GPT-2)</h3><svg class="ve-mini" viewBox="0 0 240 160" role="img" aria-label="The learned position row is added to the token embedding."><g class="ve-n" transform="translate(5 6)" ><rect class="sh" width="105" height="34" rx="6"/><text x="52.5" y="17">W_E[tok]</text></g><g class="ve-n is-st" transform="translate(130 6)" ><rect class="sh" width="105" height="34" rx="6"/><text x="52.5" y="17">W_P[t]</text></g><path class="ve-e " d="M58 42V70H100V94" /><path class="ve-e " d="M182 42V70H140V94" /><text class="ve-el " x="120" y="62" >adds</text><g class="ve-n" transform="translate(60 96)" ><rect class="sh" width="120" height="34" rx="6"/><text x="60" y="17">x_t</text></g><text class="ve-tick " x="120" y="152" >T_max rows</text></svg></div><div class="case" data-st="ok"><span class="chip info">absolute, fixed</span><h3>Sinusoidal</h3><svg class="ve-mini" viewBox="0 0 240 160" role="img" aria-label="A fixed sinusoidal vector is added to the token embedding."><g class="ve-n" transform="translate(5 6)" ><rect class="sh" width="105" height="34" rx="6"/><text x="52.5" y="17">W_E[tok]</text></g><g class="ve-n is-st" transform="translate(130 6)" ><rect class="sh" width="105" height="34" rx="6"/><text x="52.5" y="17">PE(t)</text></g><path class="ve-e " d="M58 42V70H100V94" /><path class="ve-e " d="M182 42V70H140V94" /><text class="ve-el " x="120" y="62" >adds</text><g class="ve-n" transform="translate(60 96)" ><rect class="sh" width="120" height="34" rx="6"/><text x="60" y="17">x_t</text></g><text class="ve-tick " x="120" y="152" >no parameters</text></svg></div><div class="case" data-st="ok"><span class="chip ok">relative, dominant</span><h3>RoPE</h3><svg class="ve-mini" viewBox="0 0 240 160" role="img" aria-label="RoPE rotates q and k inside attention before their dot product."><g class="ve-n" transform="translate(10 6)" ><rect class="sh" width="90" height="34" rx="6"/><text x="45" y="17">q_m</text></g><g class="ve-n" transform="translate(140 6)" ><rect class="sh" width="90" height="34" rx="6"/><text x="45" y="17">k_n</text></g><path class="ve-e is-st" d="M55 42V70" /><path class="ve-e is-st" d="M185 42V70" /><text class="ve-el r" x="60" y="60" >rotates</text><g class="ve-n is-st" transform="translate(10 74)" ><rect class="sh" width="90" height="34" rx="6"/><text x="45" y="17">q'</text></g><g class="ve-n is-st" transform="translate(140 74)" ><rect class="sh" width="90" height="34" rx="6"/><text x="45" y="17">k'</text></g><path class="ve-e no-ah" d="M100 91H140" /><text class="ve-tick " x="120" y="140" >score uses m - n</text></svg></div><div class="case" data-st="ok"><span class="chip info">relative, penalty</span><h3>ALiBi</h3><svg class="ve-mini" viewBox="0 0 240 160" role="img" aria-label="ALiBi subtracts a slope times the distance from the score."><g class="ve-n" transform="translate(10 6)" ><rect class="sh" width="130" height="34" rx="6"/><text x="65" y="17">q·k / √d_k</text></g><g class="ve-n is-st" transform="translate(150 6)" ><rect class="sh" width="80" height="34" rx="6"/><text x="40" y="17">s·(m-n)</text></g><path class="ve-e is-st" d="M75 42V82" /><path class="ve-e is-st" d="M190 42V62H110V82" /><text class="ve-el " x="130" y="56" >minus</text><g class="ve-n" transform="translate(40 84)" ><rect class="sh" width="140" height="34" rx="6"/><text x="70" y="17">score(m,n)</text></g><text class="ve-tick " x="120" y="146" >no embeddings added</text></svg></div></div><figcaption><span class="fig-n">Fig. 21</span>Four ways to give attention a sense of order. ALiBi (BLOOM, MPT) extrapolates to longer inputs without fine-tuning, but RoPE plus context-extension methods won in practice.</figcaption></figure>
