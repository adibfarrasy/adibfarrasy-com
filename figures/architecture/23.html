<figure><div class="cases"><div class="case" data-st="ok"><span class="chip info">all equal</span><h3>Position Interpolation</h3><svg class="ve-mini" viewBox="0 0 240 140" role="img" aria-label="Position Interpolation squeezes every frequency equally."><rect class="ve-bar hot" x="16" y="25" width="22" height="80" rx="2"/><rect class="ve-bar hot" x="44" y="25" width="22" height="80" rx="2"/><rect class="ve-bar hot" x="72" y="25" width="22" height="80" rx="2"/><rect class="ve-bar hot" x="100" y="25" width="22" height="80" rx="2"/><rect class="ve-bar hot" x="128" y="25" width="22" height="80" rx="2"/><rect class="ve-bar hot" x="156" y="25" width="22" height="80" rx="2"/><rect class="ve-bar hot" x="184" y="25" width="22" height="80" rx="2"/><rect class="ve-bar hot" x="212" y="25" width="22" height="80" rx="2"/><path class="ve-grid" d="M10 106H234"/><text class="ve-tick " x="40" y="128" >fast</text><text class="ve-tick " x="200" y="128" >slow</text><text class="ve-tick " x="120" y="18" >how much it is squeezed</text></svg></div><div class="case" data-st="ok"><span class="chip info">raise the base</span><h3>NTK-aware</h3><svg class="ve-mini" viewBox="0 0 240 140" role="img" aria-label="NTK-aware scaling squeezes mostly the slow dimensions."><rect class="ve-bar" x="16" y="101" width="22" height="4" rx="2"/><rect class="ve-bar" x="44" y="97" width="22" height="8" rx="2"/><rect class="ve-bar" x="72" y="89" width="22" height="16" rx="2"/><rect class="ve-bar" x="100" y="77" width="22" height="28" rx="2"/><rect class="ve-bar hot" x="128" y="61" width="22" height="44" rx="2"/><rect class="ve-bar hot" x="156" y="45" width="22" height="60" rx="2"/><rect class="ve-bar hot" x="184" y="33" width="22" height="72" rx="2"/><rect class="ve-bar hot" x="212" y="25" width="22" height="80" rx="2"/><path class="ve-grid" d="M10 106H234"/><text class="ve-tick " x="40" y="128" >fast</text><text class="ve-tick " x="200" y="128" >slow</text><text class="ve-tick " x="120" y="18" >how much it is squeezed</text></svg></div><div class="case" data-st="ok"><span class="chip info">per-frequency ramp</span><h3>YaRN</h3><svg class="ve-mini" viewBox="0 0 240 140" role="img" aria-label="YaRN leaves fast dimensions alone, fully squeezes slow ones, and blends in between."><rect class="ve-bar" x="16" y="105" width="22" height="2" rx="2"/><rect class="ve-bar" x="44" y="105" width="22" height="2" rx="2"/><rect class="ve-bar" x="72" y="105" width="22" height="2" rx="2"/><rect class="ve-bar" x="100" y="81" width="22" height="24" rx="2"/><rect class="ve-bar hot" x="128" y="57" width="22" height="48" rx="2"/><rect class="ve-bar hot" x="156" y="25" width="22" height="80" rx="2"/><rect class="ve-bar hot" x="184" y="25" width="22" height="80" rx="2"/><rect class="ve-bar hot" x="212" y="25" width="22" height="80" rx="2"/><path class="ve-grid" d="M10 106H234"/><text class="ve-tick " x="40" y="128" >fast</text><text class="ve-tick " x="200" y="128" >slow</text><text class="ve-tick " x="120" y="18" >how much it is squeezed</text></svg></div></div><figcaption><span class="fig-n">Fig. 23</span>Schematic of how each method treats the frequency ladder. Equal squeezing blurs the fast dimensions that encode local order; NTK-aware and YaRN protect them. YaRN also scales attention logits slightly, since interpolation flattens the softmax.</figcaption></figure>
