<figure class="ve-steps"><div class="frame"><svg class="ve-svg" viewBox="0 0 800 296" role="img" aria-label="Fill-in-the-middle. A document splits into prefix, middle and suffix. The training sequence is reordered to prefix token, prefix, suffix token, suffix, middle token, middle, end token. At inference the model gets prefix and suffix and writes the middle after the middle token."><g class="ve-n" data-s="1" transform="translate(20 14)"><rect class="sh" width="140" height="56" rx="6"/><text x="70" y="20.7">prefix</text><text class="sub" x="70" y="40.9">ab</text></g><g class="ve-n is-key" data-s="1" transform="translate(170 14)"><rect class="sh" width="140" height="56" rx="6"/><text x="70" y="20.7">middle</text><text class="sub" x="70" y="40.9">cd</text></g><g class="ve-n" data-s="1" transform="translate(320 14)"><rect class="sh" width="140" height="56" rx="6"/><text x="70" y="20.7">suffix</text><text class="sub" x="70" y="40.9">ef</text></g><text class="ve-tick l" data-s="1" x="480" y="48">cut at 2 random points</text><path class="ve-e" data-s="2" pathLength="1" d="M240 70V130"/><text class="ve-el r" data-s="2" x="248" y="106">rearrange</text><g class="ve-n" data-s="2" transform="translate(20 130)"><rect class="sh" width="70" height="44" rx="6"/><text x="35" y="22">&lt;PRE&gt;</text></g><g class="ve-n" data-s="2" transform="translate(98 130)"><rect class="sh" width="50" height="44" rx="6"/><text x="25" y="22">ab</text></g><g class="ve-n" data-s="2" transform="translate(156 130)"><rect class="sh" width="70" height="44" rx="6"/><text x="35" y="22">&lt;SUF&gt;</text></g><g class="ve-n" data-s="2" transform="translate(234 130)"><rect class="sh" width="50" height="44" rx="6"/><text x="25" y="22">ef</text></g><g class="ve-n" data-s="2" transform="translate(292 130)"><rect class="sh" width="70" height="44" rx="6"/><text x="35" y="22">&lt;MID&gt;</text></g><g class="ve-n is-key" data-s="2" transform="translate(370 130)"><rect class="sh" width="50" height="44" rx="6"/><text x="25" y="22">cd</text></g><g class="ve-n" data-s="2" transform="translate(428 130)"><rect class="sh" width="70" height="44" rx="6"/><text x="35" y="22">&lt;EOT&gt;</text></g><text class="ve-tick l" data-s="2" x="510" y="158">loss on every token</text><path class="ve-e" data-s="3" pathLength="1" d="M300 174V234"/><text class="ve-el r" data-s="3" x="308" y="210">at inference</text><g class="ve-n" data-s="3" transform="translate(20 234)"><rect class="sh" width="70" height="44" rx="6"/><text x="35" y="22">&lt;PRE&gt;</text></g><g class="ve-n" data-s="3" transform="translate(98 234)"><rect class="sh" width="50" height="44" rx="6"/><text x="25" y="22">ab</text></g><g class="ve-n" data-s="3" transform="translate(156 234)"><rect class="sh" width="70" height="44" rx="6"/><text x="35" y="22">&lt;SUF&gt;</text></g><g class="ve-n" data-s="3" transform="translate(234 234)"><rect class="sh" width="50" height="44" rx="6"/><text x="25" y="22">ef</text></g><g class="ve-n" data-s="3" transform="translate(292 234)"><rect class="sh" width="70" height="44" rx="6"/><text x="35" y="22">&lt;MID&gt;</text></g><path class="ve-e is-hot" data-s="3" pathLength="1" d="M362 256H424"/><text class="ve-el" data-s="3" x="393" y="246">writes</text><g class="ve-n is-key" data-s="3" transform="translate(424 234)"><rect class="sh" width="60" height="44" rx="6"/><text x="30" y="22">cd</text></g><text class="ve-tick l" data-s="3" x="480" y="262">supply prefix and suffix</text></svg></div><div class="ve-player"><ol class="ve-cap"><li data-n="1/3">Cut the document at two random character positions into prefix, middle and suffix.</li><li data-n="2/3">Reorder to PSM: &lt;PRE&gt; prefix &lt;SUF&gt; suffix &lt;MID&gt; middle &lt;EOT&gt;. SPM puts the suffix first. Applied to about half of documents, it gives infilling while left-to-right quality is unchanged ("FIM-for-free").</li><li data-n="3/3">At inference, supply prefix and suffix and generate after &lt;MID&gt;: the text that joins them. Code models (Star
