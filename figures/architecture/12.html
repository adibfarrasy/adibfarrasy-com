<figure><div class="cases"><div class="case" data-st="warn"><span class="chip warn">Leading space</span><h3>Hello vs ·Hello</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="Hello and space Hello are different tokens."><g class="ve-n is-st" transform="translate(10 20)" ><rect class="sh" width="100" height="36" rx="6"/><text x="50" y="18">Hello</text></g><g class="ve-n is-st" transform="translate(130 20)" ><rect class="sh" width="100" height="36" rx="6"/><text x="50" y="18">·Hello</text></g><text class="ve-tick " x="120" y="90" >different token ids</text></svg></div><div class="case" data-st="risk"><span class="chip risk">Inconsistent split</span><h3>Numbers</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="1234 splits as 123 and 4, while 1235 splits as 12 and 35."><g class="ve-n" transform="translate(10 6)" ><rect class="sh" width="70" height="34" rx="6"/><text x="35" y="17">1234</text></g><g class="ve-n is-st" transform="translate(100 6)" ><rect class="sh" width="56" height="34" rx="6"/><text x="28" y="17">123</text></g><g class="ve-n is-st" transform="translate(160 6)" ><rect class="sh" width="40" height="34" rx="6"/><text x="20" y="17">4</text></g><g class="ve-n" transform="translate(10 62)" ><rect class="sh" width="70" height="34" rx="6"/><text x="35" y="17">1235</text></g><g class="ve-n is-st" transform="translate(100 62)" ><rect class="sh" width="40" height="34" rx="6"/><text x="20" y="17">12</text></g><g class="ve-n is-st" transform="translate(144 62)" ><rect class="sh" width="56" height="34" rx="6"/><text x="28" y="17">35</text></g><path class="ve-e " d="M82 23H98" /><path class="ve-e " d="M82 79H98" /></svg></div><div class="case" data-st="risk"><span class="chip risk">Letters hidden</span><h3>Spelling</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="The model sees one token for strawberry, not its letters."><g class="ve-n is-st" transform="translate(30 6)" ><rect class="sh" width="180" height="34" rx="6"/><text x="90" y="17">·strawberry</text></g><path class="ve-e is-async" d="M120 42V66" /><g class="ve-n" transform="translate(30 70)" ><rect class="sh is-off" width="180" height="34" rx="6"/><text x="90" y="17">letters hidden</text></g></svg></div><div class="case" data-st="risk"><span class="chip risk">2 to 10x tokens</span><h3>Non-English</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="The same meaning costs 1x tokens in English and 2 to 10x in other languages."><text class="ve-tick l" x="20" y="16" >English</text><rect class="ve-bar" x="20" y="26" width="24" height="22" rx="2" /><text class="ve-tick l" x="20" y="70" >Other languages</text><rect class="ve-bar" x="20" y="80" width="48" height="22" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="68" y="80" width="160" height="22" rx="2" style="fill:var(--risk);opacity:.35"/></svg></div></div><figcaption><span class="fig-n">Fig. 12</span>Many "LLMs are dumb" moments are tokenization artifacts. A prompt ending in a trailing space is odd because in training the space belonged to the next word's token.</figcaption></figure>
