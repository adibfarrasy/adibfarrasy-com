<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 800 262" role="img" aria-label="AdamW update. The gradient feeds a running mean m with decay 0.9 and a running mean of squares v with decay 0.95. Bias-corrected m divided by the root of v gives the step direction. Weight decay lambda times theta is added separately, the result is scaled by the learning rate, and the weights update."><path class="ve-e" d="M80 128C110 128 110 58 140 58"/><text class="ve-el r" x="96" y="40">EMA</text><path class="ve-e" d="M80 128C110 128 110 198 140 198"/><text class="ve-el r" x="96" y="222">EMA</text><path class="ve-e" d="M300 58C330 58 330 120 360 120"/><path class="ve-e" d="M300 198C330 198 330 138 360 138"/><path class="ve-e is-hot" d="M510 129H570"/><text class="ve-el" x="540" y="120">step</text><path class="ve-e" d="M510 225C540 225 540 152 570 152"/><text class="ve-el r" x="556" y="214">adds</text><path class="ve-e is-hot" d="M670 129H710"/><g class="ve-n" transform="translate(0 95)"><rect class="sh" width="80" height="66" rx="6"/><text x="40" y="24.4">g_t</text><text class="sub" x="40" y="48.2">gradient</text></g><g class="ve-n" transform="translate(140 30)"><rect class="sh" width="160" height="56" rx="6"/><text x="80" y="20.7">m</text><text class="sub" x="80" y="40.9">avg g, β1 0.9</text></g><g class="ve-n" transform="translate(140 170)"><rect class="sh" width="160" height="56" rx="6"/><text x="80" y="20.7">v</text><text class="sub" x="80" y="40.9">avg g², β2 0.95</text></g><g class="ve-n is-key" transform="translate(360 95)"><rect class="sh" width="150" height="66" rx="6"/><text x="75" y="24.4">m̂ / √v̂</text><text class="sub" x="75" y="48.2">bias-corrected</text></g><g class="ve-n" transform="translate(360 200)"><rect class="sh" width="150" height="50" rx="6"/><text x="75" y="18.5">+ λ·θ</text><text class="sub" x="75" y="36.5">decoupled decay</text></g><g class="ve-n" transform="translate(570 95)"><rect class="sh" width="100" height="66" rx="6"/><text x="50" y="24.4">Update</text><text class="sub" x="50" y="48.2">× η_t</text></g><g class="ve-n" transform="translate(710 95)"><rect class="sh" width="90" height="66" rx="6"/><text x="45" y="24.4">θ_t</text><text class="sub" x="45" y="48.2">weights</text></g></svg></div><figcaption><span class="fig-n">Fig. 12</span>AdamW keeps two fp32 tensors per weight (m and v) and applies decay outside the adaptive scaling.</figcaption><ol class="callouts"><li><span class="co-n">1</span>LLM defaults: β1 = 0.9, β2 = 0.95 (shorter memory, so v reacts to rare large gradients), ε ≈ 1e-8, weight decay 0.1.</li><li><span class="co-n">2</span>Companions: clip the global gradient norm to 1.0; peak LR near 3e-4 at ~1B params, near 1e-4 or lower at 100B+.</li></ol></figure>
