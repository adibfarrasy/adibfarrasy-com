<figure><div class="cases"><div class="case" data-st="risk"><span class="chip risk">16 tokens</span><h3>Characters</h3><svg class="ve-mini" viewBox="0 0 240 110" role="img" aria-label="ChatGPTification as 16 single characters."><g class="ve-n" transform="translate(10 4)" ><rect class="sh" width="220" height="34" rx="6"/><text x="110" y="17">ChatGPTification</text></g><path class="ve-e is-st" d="M120 40V64" /><text class="ve-el r" x="128" y="55" >splits</text><rect class="ve-bar" x="8" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="22" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="36" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="50" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="64" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="78" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="92" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="106" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="120" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="134" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="148" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="162" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="176" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="190" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="204" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/><rect class="ve-bar" x="218" y="72" width="11" height="28" rx="2" style="fill:var(--risk)"/></svg><p class="meta">Tiny vocabulary, long sequences</p></div><div class="case" data-st="risk"><span class="chip risk">Unknown word</span><h3>Words</h3><svg class="ve-mini" viewBox="0 0 240 110" role="img" aria-label="The word is unknown, so it becomes one UNK token."><g class="ve-n" transform="translate(10 4)" ><rect class="sh" width="220" height="34" rx="6"/><text x="110" y="17">ChatGPTification</text></g><path class="ve-e is-st" d="M120 40V64" /><text class="ve-el r" x="128" y="55" >looks up</text><g class="ve-n is-st" transform="translate(70 68)" ><rect class="sh" width="100" height="34" rx="6"/><text x="50" y="17">&lt;UNK&gt;</text></g></svg><p class="meta">Huge vocabulary, unseen words break</p></div><div class="case" data-st="ok"><span class="chip ok">4 tokens</span><h3>Subwords</h3><svg class="ve-mini" viewBox="0 0 240 110" role="img" aria-label="The word splits into four reusable subwords: Chat, G, PT, ification."><g class="ve-n" transform="translate(10 4)" ><rect class="sh" width="220" height="34" rx="6"/><text x="110" y="17">ChatGPTification</text></g><path class="ve-e is-st" d="M120 40V64" /><text class="ve-el r" x="128" y="55" >splits</text><g class="ve-n is-st" transform="translate(11 68)" ><rect class="sh" width="56" height="34" rx="6"/><text x="28" y="17">·Chat</text></g><g class="ve-n is-st" transform="translate(73 68)" ><rect class="sh" width="28" height="34" rx="6"/><text x="14" y="17">G</text></g><g class="ve-n is-st" transform="translate(107 68)" ><rect class="sh" width="36" height="34" rx="6"/><text x="18" y="17">PT</text></g><g class="ve-n is-st" transform="translate(149 68)" ><rect class="sh" width="92" height="34" rx="6"/><text x="46" y="17">ification</text></g></svg><p class="meta">Fixed vocabulary, nothing unknown</p></div></div><figcaption><span class="fig-n">Fig. 7</span>The same word at three granularities. The dot in ·Chat marks a leading space. Subwords are what every modern LLM uses: about 4 characters per token in English.</figcaption></figure>
