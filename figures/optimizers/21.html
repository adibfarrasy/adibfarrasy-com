<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 800 356" role="img" aria-label="A claim that optimizer X beats AdamW must pass six checks: tune the baseline equally, match compute with finished schedules, measure wall-clock and memory, check across scales, use multiple seeds, and look at stability."><path class="ve-e" d="M150 190H245V33 H340"/><path class="ve-e" d="M150 190H245V91 H340"/><path class="ve-e" d="M150 190H245V149 H340"/><path class="ve-e" d="M150 190H245V207 H340"/><path class="ve-e" d="M150 190H245V265 H340"/><path class="ve-e" d="M150 190H245V323 H340"/><text class="ve-el" x="198" y="178">faces</text><g class="ve-n" transform="translate(340 8)"><rect class="sh" width="460" height="50" rx="6"/><text x="230" y="18.5">1  Tune the baseline as hard</text><text class="sub" x="230" y="36">sweep lr, weight decay, warmup for both</text></g><g class="ve-n" transform="translate(340 66)"><rect class="sh" width="460" height="50" rx="6"/><text x="230" y="18.5">2  Match compute, finish schedules</text><text class="sub" x="230" y="36">no intermediate cosine checkpoints</text></g><g class="ve-n" transform="translate(340 124)"><rect class="sh" width="460" height="50" rx="6"/><text x="230" y="18.5">3  Measure wall-clock and memory</text><text class="sub" x="230" y="36">second-order: fewer steps, costlier steps</text></g><g class="ve-n is-key" transform="translate(340 182)"><rect class="sh" width="460" height="50" rx="6"/><text x="230" y="18.5">4  Check across scales</text><text class="sub" x="230" y="36">gains often shrink with model size</text></g><g class="ve-n" transform="translate(340 240)"><rect class="sh" width="460" height="50" rx="6"/><text x="230" y="18.5">5  Use multiple seeds</text><text class="sub" x="230" y="36">small loss gaps can be noise</text></g><g class="ve-n" transform="translate(340 298)"><rect class="sh" width="460" height="50" rx="6"/><text x="230" y="18.5">6  Look at stability</text><text class="sub" x="230" y="36">loss spikes, sensitivity to LR</text></g><g class="ve-n is-key" transform="translate(0 150)"><rect class="sh" width="150" height="80" rx="6"/><text x="75" y="29.6">Claim</text><text class="sub" x="75" y="57.6">X beats AdamW</text></g></svg></div><figcaption><span class="fig-n">Fig. 21</span>Most wins shrink under this filter. With careful per-optimizer tuning, speedups over AdamW were about 1.1 to 1.4x at small scale and fell with model size; matrix preconditioners (Muon, SOAP) did best (Wen et al., 2025).</figcaption></figure>
