<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 800 206" role="img" aria-label="A full r by c second-moment matrix V is summarized by its row sums R and column sums C. Their outer product divided by the total gives a rank-1 reconstruction V-hat, so memory falls from r times c to r plus c."><path class="ve-e" d="M200 65H300"/><text class="ve-el" x="250" y="53">sums rows</text><path class="ve-e" d="M200 135H300"/><text class="ve-el" x="250" y="123">sums cols</text><path class="ve-e is-hot" d="M410 65H470V100H520"/><text class="ve-el" x="462" y="53">multiplies</text><path class="ve-e is-hot" d="M410 135H470V120H520"/><g class="ve-n" transform="translate(0 30)"><rect class="sh" width="200" height="120" rx="6"/><text x="100" y="44.4">V</text><text class="sub" x="100" y="86.4">r × c entries</text></g><g class="ve-n" transform="translate(300 40)"><rect class="sh" width="110" height="50" rx="6"/><text x="55" y="18.5">R</text><text class="sub" x="55" y="36">r numbers</text></g><g class="ve-n" transform="translate(300 110)"><rect class="sh" width="110" height="50" rx="6"/><text x="55" y="18.5">C</text><text class="sub" x="55" y="36">c numbers</text></g><g class="ve-n is-key" transform="translate(520 70)"><rect class="sh" width="280" height="80" rx="6"/><text x="140" y="29.6">V̂ = R Cᵀ / 1ᵀR</text><text class="sub" x="140" y="57.6">rank-1 rebuild</text></g><text class="ve-tick" x="100" y="190">memory O(rc)</text><text class="ve-tick" x="355" y="190">O(r + c)</text></svg></div><figcaption><span class="fig-n">Fig. 12</span>Adafactor keeps only row and column statistics of the second moment. It can also drop the first moment, clip updates by their RMS, and grow β₂ over time. It trained T5 and PaLM.</figcaption></figure>
