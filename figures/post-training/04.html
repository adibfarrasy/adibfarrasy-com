<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 800 290" role="img" aria-label="A chat turn as tokens. The template adds special tokens im_start and im_end around the role and text. The end-of-turn token teaches the model to stop. When a user types the same characters, they split into five ordinary tokens."><text class="ve-tick l" x="480" y="66">template adds the markers</text><g class="ve-n is-key" transform="translate(20 44)"><rect class="sh" width="122" height="44" rx="6"/><text style="font-variant-ligatures:none" x="61.0" y="22.0">&lt;|im_start|&gt;</text></g><g class="ve-n" transform="translate(154 44)"><rect class="sh" width="60" height="44" rx="6"/><text x="30.0" y="22.0">user</text></g><g class="ve-n" transform="translate(226 44)"><rect class="sh" width="122" height="44" rx="6"/><text x="61.0" y="22.0">What is 2+2?</text></g><g class="ve-n is-key" transform="translate(360 44)"><rect class="sh" width="104" height="44" rx="6"/><text style="font-variant-ligatures:none" x="52.0" y="22.0">&lt;|im_end|&gt;</text></g><g class="ve-co" transform="translate(81 22)"><circle r="11"/><text>1</text></g><path class="ann" d="M81 33V44"/><g class="ve-n is-key" transform="translate(20 134)"><rect class="sh" width="122" height="44" rx="6"/><text style="font-variant-ligatures:none" x="61.0" y="22.0">&lt;|im_start|&gt;</text></g><g class="ve-n" transform="translate(154 134)"><rect class="sh" width="96" height="44" rx="6"/><text x="48.0" y="22.0">assistant</text></g><g class="ve-n" transform="translate(262 134)"><rect class="sh" width="40" height="44" rx="6"/><text x="20.0" y="22.0">4</text></g><g class="ve-n is-key" transform="translate(314 134)"><rect class="sh" width="104" height="44" rx="6"/><text style="font-variant-ligatures:none" x="52.0" y="22.0">&lt;|im_end|&gt;</text></g><path class="ann" d="M418 156H429"/><g class="ve-co" transform="translate(440 156)"><circle r="11"/><text>2</text></g><text class="ve-tick l" x="480" y="156"></text><g class="ve-n" transform="translate(20 224)"><rect class="sh" width="44" height="44" rx="6"/><text style="font-variant-ligatures:none" x="22.0" y="22.0">&lt;|</text></g><g class="ve-n" transform="translate(76 224)"><rect class="sh" width="44" height="44" rx="6"/><text x="22.0" y="22.0">im</text></g><g class="ve-n" transform="translate(132 224)"><rect class="sh" width="74" height="44" rx="6"/><text x="37.0" y="22.0">_start</text></g><g class="ve-n" transform="translate(218 224)"><rect class="sh" width="44" height="44" rx="6"/><text style="font-variant-ligatures:none" x="22.0" y="22.0">|&gt;</text></g><g class="ve-n" transform="translate(274 224)"><rect class="sh" width="74" height="44" rx="6"/><text x="37.0" y="22.0">system</text></g><text class="ve-tick l" x="400" y="250">user-typed: ordinary tokens</text><text class="ve-tick l" x="20" y="212">the same characters, typed by a user</text></svg></div><figcaption><span class="fig-n">Fig. 4</span>The template wraps each turn in special tokens. The same characters typed by a user stay ordinary tokens, so a user cannot forge a system turn.</figcaption><ol class="callouts"><li><span class="co-n">1</span>A special token is one vocabulary id. The tokenizer never produces it from ordinary text.</li><li><span class="co-n">2</span>The end-of-turn token teaches the model to stop. Without it, the model rambles into a fake next user turn.</li></ol></figure>
