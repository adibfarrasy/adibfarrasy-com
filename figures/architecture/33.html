<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 235" role="img" aria-label="Attention score matrices for 1 thousand, 2 thousand and 4 thousand tokens: 1 times, 4 times and 16 times as many entries." style="min-width:860px"><rect class="ve-bar" x="100" y="150" width="40" height="40" rx="2" /><text class="ve-tick " x="120" y="214" >n = 1k</text><text class="ve-tick " x="120" y="140" >1x entries</text><rect class="ve-bar" x="230" y="110" width="80" height="80" rx="2" /><text class="ve-tick " x="270" y="214" >n = 2k</text><text class="ve-tick " x="270" y="100" >4x entries</text><rect class="ve-bar hot" x="410" y="30" width="160" height="160" rx="2" /><text class="ve-tick " x="490" y="214" >n = 4k</text><text class="ve-tick " x="490" y="20" >16x entries</text><text class="ve-tick l" x="700" y="100" >double the context,</text><text class="ve-tick l" x="700" y="124" >four times the</text><text class="ve-tick l" x="700" y="148" >score matrix</text></svg></div><figcaption><span class="fig-n">Fig. 33</span>Attention is \(O(n^2 d)\) compute and \(O(n^2)\) memory per head. The MLP and projections cost \(O(n d^2)\), linear in n. Past a few thousand tokens attention dominates, which is why context is limited.</figcaption></figure>
