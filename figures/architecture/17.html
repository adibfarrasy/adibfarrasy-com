<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 215" role="img" aria-label="The word bank in two sentences gets the same embedding vector. After attention mixes in river or loan, the two vectors differ." style="min-width:860px"><g class="ve-n" transform="translate(20 20)" ><rect class="sh" width="200" height="44" rx="6"/><text x="100" y="22">the river bank</text></g><g class="ve-n" transform="translate(20 150)" ><rect class="sh" width="200" height="44" rx="6"/><text x="100" y="22">the bank loan</text></g><g class="ve-n is-key" transform="translate(380 85)" ><rect class="sh" width="220" height="50" rx="6"/><text x="110" y="14">W_E[bank]</text><text class="sub" x="110" y="36">same vector</text></g><path class="ve-e " d="M220 42C300 42 300 100 380 100" /><path class="ve-e " d="M220 172C300 172 300 120 380 120" /><text class="ve-el " x="300" y="40" >looks up</text><g class="ve-n" transform="translate(760 20)" ><rect class="sh" width="220" height="50" rx="6"/><text x="110" y="14">bank (shore)</text><text class="sub" x="110" y="36">after attention</text></g><g class="ve-n" transform="translate(760 150)" ><rect class="sh" width="220" height="50" rx="6"/><text x="110" y="14">bank (money)</text><text class="sub" x="110" y="36">after attention</text></g><path class="ve-e is-hot" d="M600 100C680 100 680 45 760 45" /><path class="ve-e is-hot" d="M600 120C680 120 680 175 760 175" /><text class="ve-el " x="690" y="34" >mixes in river</text><text class="ve-el " x="690" y="196" >mixes in loan</text></svg></div><figcaption><span class="fig-n">Fig. 17</span>An input embedding depends only on the token ID, so it cannot tell two senses of " bank" apart. Attention adds context in later layers: the embedding table is a dictionary of initial guesses that the blocks edit.</figcaption></figure>
