<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 190" role="img" aria-label="A token at position 12,000 in a 16k window is read as position 3,000, which lies inside the 4k range the model was trained on." style="min-width:860px"><g class="ve-zone"><rect x="270" y="100" width="690" height="40" rx="8"/><text x="282" y="122">never seen in training</text></g><rect class="ve-bar hot" x="40" y="112" width="230" height="16" rx="2" /><text class="ve-tick " x="40" y="162" >0</text><text class="ve-tick " x="270" y="162" >4k</text><text class="ve-tick " x="500" y="162" >8k</text><text class="ve-tick " x="730" y="162" >12k</text><text class="ve-tick " x="960" y="162" >16k</text><g class="ve-n" transform="translate(640 20)" ><rect class="sh" width="180" height="44" rx="6"/><text x="90" y="22">m = 12,000</text></g><g class="ve-n is-key" transform="translate(122.5 20)" ><rect class="sh" width="180" height="44" rx="6"/><text x="90" y="22">reads as 3,000</text></g><path class="ann" d="M730 64V112"/><path class="ve-e is-hot" d="M640 42H302.5" /><text class="ve-el " x="471.25" y="32" >divide by s = 4</text><path class="ve-e is-hot" d="M212.5 64V110" /></svg></div><figcaption><span class="fig-n">Fig. 22</span>Position Interpolation extends a 4k model to 16k by using \(m/s\) instead of \(m\). Angles stay in the trained range, at the cost of squeezing neighbours closer. A short fine-tune (about 1000 steps) recovers quality.</figcaption></figure>
