)"/><g class="ve-n" transform="translate(615 40)" ><rect class="sh" width="170" height="50" rx="6"/><text x="85" y="14">GPT-2</text><text class="sub" x="85" y="36">2019, 1.5B</text></g><path class="ann" d="M700 90V150"/><circle cx="700" cy="150" r="4" style="fill:var(--accent)"/><g class="ve-n" transform="translate(715 210)" ><rect class="sh" width="170" height="50" rx="6"/><text x="85" y="14">GPT-3</text><text class="sub" x="85" y="36">2020, 175B</text></g><path class="ann" d="M800 210V150"/><circle cx="800" cy="150" r="4" style="fill:var(--accent)"/><g class="ve-n" transform="translate(815 40)" ><rect class="sh" width="170" height="50" rx="6"/><text x="85" y="14">ChatGPT</text><text class="sub" x="85" y="36">2022 post-training</text></g><path class="ann" d="M900 90V150"/><circle cx="900" cy="150" r="4" style="fill:var(--accent)"/></svg></div><figcaption><span class="fig-n">Fig. 4</span>From recurrence to attention to scale. Spacing is not to scale. The Transformer won mostly because training parallelizes and any two positions connect in one step.</figcaption></figure>
