t></g><path class="ve-e is-st" d="M120 172V186" /><g class="ve-n" transform="translate(90 188)" ><rect class="sh" width="60" height="34" rx="6"/><text x="30" y="17">out</text></g></svg></div><div class="case" data-st="ok"><span class="chip ok">nearly equal</span><h3>Parameters</h3><svg class="ve-mini" viewBox="0 0 240 235" role="img" aria-label="Parameter counts at d_model 4096: GELU MLP 134 million, SwiGLU 135 million."><text class="ve-tick " x="120" y="16" >d_model = 4096</text><text class="ve-tick l" x="20" y="56" >GELU, 4C</text><rect class="ve-bar" x="20" y="66" width="200" height="24" rx="2" /><text class="ve-bar-v" x="20" y="108" >134M</text><text class="ve-tick l" x="20" y="150" >SwiGLU, 11008</text><rect class="ve-bar hot" x="20" y="160" width="201.2" height="24" rx="2" /><text class="ve-bar-v" x="20" y="202" >135M</text></svg></div></div><figcaption><span class="fig-n">Fig. 39</span>The MLP processes each position alone, with hidden width \(d_{\text{ff}} = 4\,d_{\text{model}}\) (3072 in GPT-2 small). SwiGLU has three matrices, so \(d_{\text{ff}}\) is set near \(\tfrac{8}{3}d_{\text{model}}\) to keep the parameter count equal. The MLP holds about two thirds of a dense transformer's parameters.</figcaption></figure>
