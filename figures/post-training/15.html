<figure><div class="cases"><div class="case"><span class="chip plain">reference model</span><h3>DPO</h3><svg class="ve-mini" viewBox="0 0 240 154" role="img" aria-label="DPO takes pairs data with a reference model and uses the loss log σ(β Δ ratio)."><g class="ve-n" transform="translate(10 6)"><rect class="sh" width="110" height="34" rx="6"/><text x="55.0" y="17.0">pairs</text></g><path class="ve-e" d="M65 40V100"/><text class="ve-el r" x="73" y="60">reads</text><g class="ve-n" transform="translate(130 6)"><rect class="sh" width="100" height="34" rx="6"/><text x="50.0" y="17.0">πref</text></g><path class="ve-e" d="M190 40V100"/><text class="ve-el l" x="182" y="82">anchors</text><g class="ve-n is-key" transform="translate(10 100)"><rect class="sh" width="220" height="44" rx="6"/><text x="110.0" y="22.0">log σ(β Δ ratio)</text></g></svg><p>Bradley-Terry on the implicit reward.</p></div><div class="case"><span class="chip plain">reference model</span><h3>IPO</h3><svg class="ve-mini" viewBox="0 0 240 154" role="img" aria-label="IPO takes pairs data with a reference model and uses the loss (Δ − 1/2τ)²."><g class="ve-n" transform="translate(10 6)"><rect class="sh" width="110" height="34" rx="6"/><text x="55.0" y="17.0">pairs</text></g><path class="ve-e" d="M65 40V100"/><text class="ve-el r" x="73" y="60">reads</text><g class="ve-n" transform="translate(130 6)"><rect class="sh" width="100" height="34" rx="6"/><text x="50.0" y="17.0">πref</text></g><path class="ve-e" d="M190 40V100"/><text class="ve-el l" x="182" y="82">anchors</text><g class="ve-n is-key" transform="translate(10 100)"><rect class="sh" width="220" height="44" rx="6"/><text x="110.0" y="22.0">(Δ − 1/2τ)²</text></g></svg><p>Squared loss to a finite margin, so KL still bites when preferences are deterministic.</p></div><div class="case"><span class="chip plain">reference model</span><h3>KTO</h3><svg class="ve-mini" viewBox="0 0 240 154" role="img" aria-label="KTO takes unpaired data with a reference model and uses the loss gain vs z0."><g class="ve-n" transform="translate(10 6)"><rect class="sh" width="110" height="34" rx="6"/><text x="55.0" y="17.0">unpaired</text></g><path class="ve-e" d="M65 40V100"/><text class="ve-el r" x="73" y="60">reads</text><g class="ve-n" transform="translate(130 6)"><rect class="sh" width="100" height="34" rx="6"/><text x="50.0" y="17.0">πref</text></g><path class="ve-e" d="M190 40V100"/><text class="ve-el l" x="182" y="82">anchors</text><g class="ve-n is-key" transform="translate(10 100)"><rect class="sh" width="220" height="44" rx="6"/><text x="110.0" y="22.0">gain vs z0</text></g></svg><p>Needs only thumbs up or down per response.</p></div><div class="case" data-st="ok"><span class="chip ok">no reference model</span><h3>ORPO</h3><svg class="ve-mini" viewBox="0 0 240 154" role="img" aria-label="ORPO takes pairs data without a reference model and uses the loss SFT + odds ratio."><g class="ve-n" transform="translate(10 6)"><rect class="sh" width="110" height="34" rx="6"/><text x="55.0" y="17.0">pairs</text></g><path class="ve-e" d="M65 40V100"/><text class="ve-el r" x="73" y="60">reads</text><g class="ve-n" transform="translate(130 6)"><rect class="sh is-off" width="100" height="34" rx="6"/><text x="50.0" y="17.0">no πref</text></g><g class="ve-n is-key" transform="translate(10 100)"><rect class="sh" width="220" height="44" rx="6"/><text x="110.0" y="22.0">SFT + odds ratio</text></g></svg><p>SFT and preference in one stage, starting from the base model.</p></div><div class="case" data-st="ok"><span class="chip ok">no reference model</span><h3>SimPO</h3><svg class="ve-mini" viewBox="0 0 240 154" role="img" aria-label="SimPO takes pairs data without a reference model and uses the loss avg logp − γ."><g class="ve-n" transform="translate(10 6)"><rect class="sh" width="110" height="34" rx="6"/><text x="55.0" y="17.0">pairs</text></g><path class="ve-e" d="M65 40V100"/><text class="ve-el r" x="73" y="60">reads</text><g class="ve-n" transform="translate(130 6)"><rect class="sh is-off" width="100" height="34" rx="6"/><text x="50.0" y="17.0">no πref</text></g><g class="ve-n is-key" transform="translate(10 100)"><rect class="sh" width="220" height="44" rx="6"/><text x="110.0" y="22.0">avg logp − γ</text></g></svg><p>Average log-prob as reward, plus a target margin.</p></div><div class="case"><span class="chip plain">reference model</span><h3>LN-DPO</h3><svg class="ve-mini" viewBox="0 0 240 154" role="img" aria-label="LN-DPO takes pairs data with a reference model and uses the loss Δ ratio / length."><g class="ve-n" transform="translate(10 6)"><rect class="sh" width="110" height="34" rx="6"/><text x="55.0" y="17.0">pairs</text></g><path class="ve-e" d="M65 40V100"/><text class="ve-el r" x="73" y="60">reads</text><g class="ve-n" transform="translate(130 6)"><rect class="sh" width="100" height="34" rx="6"/><text x="50.0" y="17.0">πref</text></g><path class="ve-e" d="M190 40V100"/><text class="ve-el l" x="182" y="82">anchors</text><g class="ve-n is-key" transform="translate(10 100)"><rect class="sh" width="220" height="44" rx="6"/><text x="110.0" y="22.0">Δ ratio / length</text></g></svg><p>Divides log-ratios by length to fight length bias. Used in Tulu 3.</p></div></div><figcaption><span class="fig-n">Fig. 15</span>Same inputs, different loss. No variant wins everywhere, and well-tuned DPO remains a strong baseline.</figcaption></figure>
