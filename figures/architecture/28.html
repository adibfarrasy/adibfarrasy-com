<figure><div class="cases"><div class="case" data-st="risk"><span class="chip risk">gradient near 0</span><h3>Raw scores (±8)</h3><svg class="ve-mini" viewBox="0 0 240 160" role="img" aria-label="Without scaling, softmax is almost one-hot."><rect class="ve-bar hot" x="19" y="40.2" width="34" height="89.8" rx="2"/><text class="ve-bar-v" x="19" y="28.2">1.00</text><text class="ve-tick " x="36" y="150" >a</text><rect class="ve-bar" x="61" y="128.5" width="34" height="1.5" rx="2"/><text class="ve-bar-v" x="61" y="116.5">0.00</text><text class="ve-tick " x="78" y="150" >b</text><rect class="ve-bar" x="103" y="128.5" width="34" height="1.5" rx="2"/><text class="ve-bar-v" x="103" y="116.5">0.00</text><text class="ve-tick " x="120" y="150" >c</text><rect class="ve-bar" x="145" y="128.5" width="34" height="1.5" rx="2"/><text class="ve-bar-v" x="145" y="116.5">0.00</text><text class="ve-tick " x="162" y="150" >d</text><path class="ve-grid" d="M13 130H187"/></svg></div><div class="case" data-st="ok"><span class="chip ok">gradients flow</span><h3>Divided by √64</h3><svg class="ve-mini" viewBox="0 0 240 160" role="img" aria-label="With scaling by one over root d_k, the weights stay spread."><rect class="ve-bar hot" x="19" y="79.3" width="34" height="50.7" rx="2"/><text class="ve-bar-v" x="19" y="67.3">0.56</text><text class="ve-tick " x="36" y="150" >a</text><rect class="ve-bar" x="61" y="106.0" width="34" height="24.0" rx="2"/><text class="ve-bar-v" x="61" y="94.0">0.27</text><text class="ve-tick " x="78" y="150" >b</text><rect class="ve-bar" x="103" y="120.0" width="34" height="10.0" rx="2"/><text class="ve-bar-v" x="103" y="108.0">0.11</text><text class="ve-tick " x="120" y="150" >c</text><rect class="ve-bar" x="145" y="124.7" width="34" height="5.3" rx="2"/><text class="ve-bar-v" x="145" y="112.7">0.06</text><text class="ve-tick " x="162" y="150" >d</text><path class="ve-grid" d="M13 130H187"/></svg></div></div><figcaption><span class="fig-n">Fig. 28</span>Why divide by \(\sqrt{d_k}\). With unit-variance entries, \(q\cdot k\) has variance \(d_k\), so with \(d_k = 64\) scores are around ±8. Softmax of such scores saturates and learning stalls.</figcaption></figure>
