<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 800 240" role="img" aria-label="Left: SGD zigzags across a narrow valley and advances slowly. Right: momentum cancels the sideways oscillation and moves smoothly along the valley floor."><ellipse class="ann" cx="190" cy="135" rx="170" ry="52" fill="none"/><ellipse class="ann" cx="190" cy="135" rx="102" ry="31.2" fill="none"/><ellipse class="ann" cx="190" cy="135" rx="51" ry="15.6" fill="none"/><ellipse class="ann" cx="590" cy="135" rx="170" ry="52" fill="none"/><ellipse class="ann" cx="590" cy="135" rx="102" ry="31.2" fill="none"/><ellipse class="ann" cx="590" cy="135" rx="51" ry="15.6" fill="none"/><text class="ve-tick" x="190" y="18">SGD: crosses the valley</text><text class="ve-tick" x="590" y="18">Momentum: drifts along it</text><path class="ve-e" d="M30 92L58 182L86 96L114 172L142 108L166 160L190 135"/><text class="ve-el" x="60" y="214">oscillates</text><path class="ve-e is-hot" d="M430 100C500 108 540 122 590 135"/><text class="ve-el" x="590" y="222">accumulates the drift</text></svg></div><figcaption><span class="fig-n">Fig. 3</span>Across the valley the gradient flips sign, so averaging cancels it. Along the valley it keeps its sign, so averaging builds speed up to 1/(1-μ) = 10x.</figcaption></figure>
