<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 225" role="img" aria-label="Post-norm applies the normalization after the addition, on the stream itself. Pre-norm normalizes only the input to each sub-layer and leaves the stream an untouched sum." style="min-width:860px"><text class="ve-tick l" x="20" y="20" >POST-NORM (2017): the norm sits on the stream</text><text class="ve-tick l" x="530" y="20" >PRE-NORM (GPT-2 on): the stream stays a plain sum</text><g class="ve-n" transform="translate(20 85)" ><rect class="sh" width="60" height="50" rx="6"/><text x="30" y="25">x</text></g><g class="ve-n" transform="translate(120 85)" ><rect class="sh" width="90" height="50" rx="6"/><text x="45" y="25">Attn</text></g><g class="ve-n" transform="translate(250 88)" ><rect class="sh" width="44" height="44" rx="6"/><text x="22" y="22">+</text></g><g class="ve-n is-st" transform="translate(340 85)" ><rect class="sh" width="90" height="50" rx="6"/><text x="45" y="25">Norm</text></g><path class="ve-e " d="M80 110H120" /><path class="ve-e " d="M210 110H250" /><path class="ve-e is-async" d="M50 85V50H272V86" /><text class="ve-el " x="160" y="44" >skip</text><path class="ve-e " d="M294 110H340" /><path class="ve-e " d="M430 110H470" /><text class="ve-el " x="452" y="100" >x'</text><g class="ve-n" transform="translate(540 85)" ><rect class="sh" width="60" height="50" rx="6"/><text x="30" y="25">x</text></g><path class="ve-e is-hot no-ah" d="M600 110H906" /><g class="ve-n" transform="translate(908 88)" ><rect class="sh" width="44" height="44" rx="6"/><text x="22" y="22">+</text></g><path class="ve-e is-hot" d="M952 110H985" /><path class="ve-e " d="M640 110V180H670" /><text class="ve-el r" x="648" y="150" >reads</text><g class="ve-n" transform="translate(670 155)" ><rect class="sh" width="90" height="50" rx="6"/><text x="45" y="25">Norm</text></g><path class="ve-e " d="M760 180H795" /><g class="ve-n is-key" transform="translate(795 155)" ><rect class="sh" width="90" height="50" rx="6"/><text x="45" y="25">Attn</text></g><path class="ve-e " d="M885 180H930V134" /><text class="ve-el r" x="938" y="160" >adds</text></svg></div><figcaption><span class="fig-n">Fig. 37</span>Pre-norm versus post-norm. In post-norm the stream is renormalized after every sub-layer and trains poorly in deep models without careful warmup. In pre-norm the identity gradient path is clean. Because the stream is never normalized, pre-norm needs one final norm (<code>ln_f</code>) before the unembedding.</figcaption></figure>
