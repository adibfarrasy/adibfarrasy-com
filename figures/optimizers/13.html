<figure><div class="cases"><div class="case" data-st="ok"><span class="chip ok">1 state buffer</span><h3>Lion: sign of a blend</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="Five bars of equal height pointing up or down: every coordinate moves by exactly plus or minus eta."><rect class="ve-bar hot" x="24" y="35" width="28" height="30" rx="2"/><rect class="ve-bar hot" x="64" y="65" width="28" height="30" rx="2"/><rect class="ve-bar hot" x="104" y="35" width="28" height="30" rx="2"/><rect class="ve-bar hot" x="144" y="35" width="28" height="30" rx="2"/><rect class="ve-bar hot" x="184" y="65" width="28" height="30" rx="2"/><path class="ve-grid" d="M10 65H230"/><text class="ve-el" x="120" y="112">every step is ±η</text></svg><p>Half of Adam's memory. Needs a 3 to 10x smaller LR and a larger decay.</p></div><div class="case" data-st="warn"><span class="chip warn">Gains shrank</span><h3>Sophia: clipped Newton step</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="A response curve that is flat at minus one, linear in the middle and flat at plus one."><path class="ve-grid" d="M10 65H230"/><path class="ve-e no-ah is-hot" d="M20 100L70 100L170 30L220 30"/><text class="ve-tick l" x="20" y="118">−1</text><text class="ve-tick" x="215" y="20">+1</text></svg><p>Reported 2x fewer steps; tuned benchmarks found much smaller gaps.</p></div><div class="case" data-st="ok"><span class="chip ok">Matrix-aware</span><h3>Shampoo and SOAP</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="The gradient matrix G is preconditioned on the left by L to the minus one quarter and on the right by R to the minus one quarter."><g class="ve-n" transform="translate(0 34)"><rect class="sh" width="50" height="50" rx="6"/><text x="25" y="25">L</text></g><g class="ve-n is-key" transform="translate(95 34)"><rect class="sh" width="50" height="50" rx="6"/><text x="25" y="25">G</text></g><g class="ve-n" transform="translate(190 34)"><rect class="sh" width="50" height="50" rx="6"/><text x="25" y="25">R</text></g><path class="ve-e" d="M50 59H95"/><text class="ve-el" x="72" y="24">L⁻¼</text><path class="ve-e" d="M190 59H145"/><text class="ve-el" x="168" y="24">R⁻¼</text><text class="ve-tick" x="120" y="112">SOAP: Adam inside this basis</text></svg><p>Rows and columns are correlated; coordinates are not independent.</p></div></div><figcaption><span class="fig-n">Fig. 13</span>Four ways past a per-coordinate denominator. Section 13 explains why the claims shrink under careful tuning.</figcaption></figure>
