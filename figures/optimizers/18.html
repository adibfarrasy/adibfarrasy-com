<figure class="ve-steps"><div class="frame"><svg class="ve-svg" viewBox="0 0 800 226" role="img" aria-label="Muon step as a flow. The gradient updates the momentum buffer, the Nesterov mix of gradient and buffer is orthogonalized with five Newton-Schulz iterations, rescaled by 0.2 times the root of the larger dimension, and applied to the weights after decay."><path class="ve-e" data-s="2" pathLength="1" d="M170 60H315"/><text class="ve-el" data-s="2" x="242" y="48">accumulates</text><path class="ve-e" data-s="3" pathLength="1" d="M485 60H630"/><text class="ve-el" data-s="3" x="557" y="48">looks ahead</text><path class="ve-e" data-s="4" pathLength="1" d="M715 90V120H85V150"/><text class="ve-el" data-s="4" x="400" y="108">orthogonalizes</text><path class="ve-e is-hot" data-s="5" pathLength="1" d="M170 180H315"/><text class="ve-el" data-s="5" x="242" y="168">rescales</text><path class="ve-e is-hot" data-s="6" pathLength="1" d="M485 180H630"/><text class="ve-el" data-s="6" x="557" y="168">applies</text><g class="ve-n" data-s="1" transform="translate(0 30)"><rect class="sh" width="170" height="60" rx="6"/><text x="85" y="22.2">G</text><text class="sub" x="85" y="43.2">gradient</text></g><g class="ve-n" data-s="2" transform="translate(315 30)"><rect class="sh" width="170" height="60" rx="6"/><text x="85" y="22.2">B</text><text class="sub" x="85" y="43.2">buf·μ + G</text></g><g class="ve-n" data-s="3" transform="translate(630 30)"><rect class="sh" width="170" height="60" rx="6"/><text x="85" y="22.2">G + μB</text><text class="sub" x="85" y="43.2">nesterov mix</text></g><g class="ve-n is-key" data-s="4" transform="translate(0 150)"><rect class="sh" width="170" height="60" rx="6"/><text x="85" y="22.2">O</text><text class="sub" x="85" y="43.2">Newton-Schulz ×5</text></g><g class="ve-n" data-s="5" transform="translate(315 150)"><rect class="sh" width="170" height="60" rx="6"/><text x="85" y="22.2">s · O</text><text class="sub" x="85" y="43.2">0.2 √max(r,c)</text></g><g class="ve-n is-key" data-s="6" transform="translate(630 150)"><rect class="sh" width="170" height="60" rx="6"/><text x="85" y="22.2">W</text><text class="sub" x="85" y="43.2">W ← W − lr·s·O</text></g></svg></div><div class="ve-player"><ol class="ve-cap"><li data-n="1/6">The gradient of one 2D hidden weight \(W\).</li><li data-n="2/6"><code>buf.mul_(momentum).add_(grad)</code>: the momentum buffer, \(\mu = 0.95\).</li><li data-n="3/6">Nesterov: <code>grad.add(buf, alpha=momentum)</code> is the matrix to orthogonalize.</li><li data-n="4/6"><code>newton_schulz5</code>: five matmul iterations push singular values toward 1.</li><li data-n="5/6">Scale by \(0.2\sqrt{\max(r,c)}\) so the update RMS matches AdamW and its LR and decay transfer.</li><li data-n="6/6">Decay the weights, then subtract the scaled update.</li></ol><button data-go="-1" aria-label="Previous step">←</button><button data-play>Play</button><input type="range" min="0" value="0" aria-label="Step"><button data-go="1" aria-label="Next step">→</button></div><figcaption><span class="fig-n">Fig. 18</span>Read left to right, then down. Each node is one line of <code>muon_step</code>.</figcaption></figure>
