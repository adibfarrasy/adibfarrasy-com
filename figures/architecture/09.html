<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 160" role="img" aria-label="GPT-2 vocabulary of 50,257 entries: 256 byte values, 50,000 learned merges, and one special end of text token." style="min-width:860px"><g class="ve-dim is-key"><path class="ext" d="M20 52V46M920 52V46"/><path class="ln" d="M20 40H920"/><text x="470" y="32">50,257 entries in GPT-2</text></g><rect class="ve-bar hot" x="20" y="62" width="4.6" height="34" rx="2" /><rect class="ve-bar" x="24.6" y="62" width="895.4" height="34" rx="2" /><rect class="ve-bar hot" x="918.5" y="62" width="1.5" height="34" rx="2" /><path class="ann" d="M22 96V120"/><g class="ve-co" transform="translate(22 132)" ><circle r="11"/><text>1</text></g><path class="ann" d="M470 96V120"/><g class="ve-co" transform="translate(470 132)" ><circle r="11"/><text>2</text></g><path class="ann" d="M919 96V120"/><g class="ve-co" transform="translate(919 132)" ><circle r="11"/><text>3</text></g></svg></div><figcaption><span class="fig-n">Fig. 9</span>Byte-level BPE starts from the 256 UTF-8 byte values, so any string can be encoded. A regex pre-tokenizer first splits text into chunks and merges never cross chunk boundaries; a leading space attaches to the following word.</figcaption><ol class="callouts"><li><span class="co-n">1</span>256 byte values: the base vocabulary.</li><li><span class="co-n">2</span>50,000 learned merges.</li><li><span class="co-n">3</span>One special token, <code>&lt;|endoftext|&gt;</code>.</li></ol></figure>
