<figure class="ve-steps"><div class="frame"><svg class="ve-svg" viewBox="0 0 800 266" role="img" aria-label="Adam pipeline. The gradient feeds two averages: m, the EMA of g, and v, the EMA of g squared. Each is divided by one minus beta to the t to correct its start-up bias. The parameter step is the corrected m over the root of the corrected v plus epsilon."><path class="ve-e" data-s="2" pathLength="1" d="M110 140H150V60H190"/><text class="ve-el" data-s="2" x="150" y="50">avg</text><path class="ve-e" data-s="3" pathLength="1" d="M110 140H150V220H190"/><text class="ve-el" data-s="3" x="150" y="210">avg g²</text><path class="ve-e" data-s="4" pathLength="1" d="M330 60H420"/><text class="ve-el" data-s="4" x="375" y="48">unbias</text><path class="ve-e" data-s="4" pathLength="1" d="M330 220H420"/><text class="ve-el" data-s="4" x="375" y="208">unbias</text><path class="ve-e is-hot" data-s="5" pathLength="1" d="M540 60H595V125H650"/><text class="ve-el" data-s="5" x="596" y="48">numerator</text><path class="ve-e is-hot" data-s="5" pathLength="1" d="M540 220H595V155H650"/><text class="ve-el" data-s="5" x="596" y="244">denominator</text><g class="ve-n" data-s="1" transform="translate(0 110)"><rect class="sh" width="110" height="60" rx="6"/><text x="55" y="22.2">g_t</text><text class="sub" x="55" y="43.2">gradient</text></g><g class="ve-n" data-s="2" transform="translate(190 30)"><rect class="sh" width="140" height="60" rx="6"/><text x="70" y="22.2">m_t</text><text class="sub" x="70" y="43.2">EMA of g</text></g><g class="ve-n" data-s="3" transform="translate(190 190)"><rect class="sh" width="140" height="60" rx="6"/><text x="70" y="22.2">v_t</text><text class="sub" x="70" y="43.2">EMA of g²</text></g><g class="ve-n" data-s="4" transform="translate(420 30)"><rect class="sh" width="120" height="60" rx="6"/><text x="60" y="22.2">m̂_t</text><text class="sub" x="60" y="43.2">corrected</text></g><g class="ve-n" data-s="4" transform="translate(420 190)"><rect class="sh" width="120" height="60" rx="6"/><text x="60" y="22.2">v̂_t</text><text class="sub" x="60" y="43.2">corrected</text></g><g class="ve-n is-key" data-s="5" transform="translate(650 110)"><rect class="sh" width="150" height="60" rx="6"/><text x="75" y="22.2">θ_t</text><text class="sub" x="75" y="43.2">m̂ / (√v̂ + ε)</text></g></svg></div><div class="ve-player"><ol class="ve-cap"><li data-n="1/5">Each step starts from the minibatch gradient \(g_t\).</li><li data-n="2/5">\(m_t\): EMA of gradients, \(\beta_1 = 0.9\). This is the momentum part.</li><li data-n="3/5">\(v_t\): EMA of squared gradients, \(\beta_2 = 0.999\) by default and 0.95 for most LLMs. This is the RMSProp part.</li><li data-n="4/5">Both start at 0, so early values are too small. Divide each by \(1-\beta^t\).</li><li data-n="5/5">Step by \(\eta \, \hat m_t / (\sqrt{\hat v_t} + \epsilon)\). With a steady gradient every coordinate moves by about \(\eta\).</li></ol><button data-go="-1" aria-label="Previous step">←</button><button data-play>Play</button><input type="range" min="0" value="0" aria-label="Step"><button data-go="1" aria-label="Next step">→</button></div><figcaption><span class="fig-n">Fig. 5</span>Momentum on top, RMSProp below, corrected, then divided. Step through it.</figcaption></figure>
