="ve-bar-v" x="102" y="118" >0.2</text><text class="ve-bar-v" x="182" y="118" >0.7</text><g class="ve-n is-st" transform="translate(60 132)" ><rect class="sh" width="120" height="32" rx="6"/><text x="60" y="16">Σ w · v</text></g></svg></div></div><figcaption><span class="fig-n">Fig. 24</span>Each token makes a query (what am I looking for), a key (what do I contain, for being found) and a value (what I hand over). Attention returns a blend, which is what makes it differentiable.</figcaption></figure>
