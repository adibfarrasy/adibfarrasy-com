<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 215" role="img" aria-label="Four word vectors form a parallelogram: man to woman and king to queen share a direction, man to king and woman to queen share another." style="min-width:860px"><g class="ve-n" transform="translate(60 150)" ><rect class="sh" width="120" height="44" rx="6"/><text x="60" y="22">man</text></g><g class="ve-n" transform="translate(60 30)" ><rect class="sh" width="120" height="44" rx="6"/><text x="60" y="22">woman</text></g><g class="ve-n" transform="translate(360 150)" ><rect class="sh" width="120" height="44" rx="6"/><text x="60" y="22">king</text></g><g class="ve-n is-key" transform="translate(360 30)" ><rect class="sh" width="120" height="44" rx="6"/><text x="60" y="22">queen</text></g><path class="ve-e " d="M120 150V76" /><text class="ve-el r" x="130" y="116" >+ female</text><path class="ve-e is-hot" d="M420 150V76" /><text class="ve-el r" x="430" y="116" >+ female</text><path class="ve-e " d="M182 172H358" /><text class="ve-el " x="270" y="162" >+ royal</text><path class="ve-e is-hot" d="M182 52H358" /><text class="ve-el " x="270" y="42" >+ royal</text><text class="ve-tick " x="760" y="60" style="text-anchor:middle">king - man + woman</text><text class="ve-tick " x="760" y="92" >lands near queen</text></svg></div><figcaption><span class="fig-n">Fig. 16</span>Some directions in embedding space carry meaning (word2vec, Mikolov et al., 2013). In LLM input embeddings the relations are messier: the input embedding only has to be a good starting point. Tokens used in similar contexts get similar vectors.</figcaption></figure>
