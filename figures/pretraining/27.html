xt></g><text class="ve-el" x="435" y="26">emits</text><text class="ve-tick l" x="600" y="60">HumanEval +12%</text><rect class="ve-bar hot" x="600" y="70" width="72" height="16" rx="2"/><text class="ve-tick l" x="600" y="126">MBPP +17%</text><rect class="ve-bar hot" x="600" y="136" width="102" height="16" rx="2"/><text class="ve-tick l" x="600" y="196">up to 3× faster decode</text><text class="ve-tick l" x="600" y="216">with self-speculation</text></svg></div><figcaption><span class="fig-n">Fig. 27</span>Four heads on one trunk give more training signal per position and a built-in draft model for speculative decoding.</figcaption></figure>
