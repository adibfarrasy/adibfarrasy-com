<figure><div class="cases"><div class="case" data-st="warn"><span class="chip warn">Kaplan, 2020</span><h3>Mostly parameters</h3><svg class="ve-mini" viewBox="0 0 240 132" role="img" aria-label="Kaplan: ten times the compute makes parameters 5.4 times larger and tokens 1.9 times larger."><text class="ve-tick l" x="12" y="16">compute × 10 gives</text><text class="ve-tick l" x="12" y="48">params N</text><rect class="ve-bar hot" x="12" y="56" width="161.1" height="16" rx="2"/><text class="ve-bar-v" x="179.1" y="64">×5.4</text><text class="ve-tick l" x="12" y="98">tokens D</text><rect class="ve-bar" x="12" y="106" width="55.9" height="16" rx="2"/><text class="ve-bar-v" x="73.9" y="114">×1.9</text></svg><p>N ∝ C<sup>0.73</sup>. Shaped GPT-3 (175B params, 300B tokens). The fit used one fixed schedule length for every run, which hurt short runs of small models.</p></div><div class="case" data-st="ok"><span class="chip ok">Chinchilla, 2022</span><h3>Parameters and tokens equally</h3><svg class="ve-mini" viewBox="0 0 240 132" role="img" aria-label="Chinchilla: ten times the compute makes parameters and tokens both 3.2 times larger."><text class="ve-tick l" x="12" y="16">compute × 10 gives</text><text class="ve-tick l" x="12" y="48">params N</text><rect class="ve-bar hot" x="12" y="56" width="94.9" height="16" rx="2"/><text class="ve-bar-v" x="112.9" y="64">×3.2</text><text class="ve-tick l" x="12" y="98">tokens D</text><rect class="ve-bar" x="12" y="106" width="94.9" height="16" rx="2"/><text class="ve-bar-v" x="112.9" y="114">×3.2</text></svg><p>N, D ∝ C<sup>0.5</sup>, about 20 tokens per parameter. The 70B Chinchilla on 1.4T tokens beat the 280B Gopher at the same compute.</p></div></div><figcaption><span class="fig-n">Fig. 10</span>When compute grows 10×, the two studies spend it differently. Schedules matched to run length is the fix.</figcaption></figure>
