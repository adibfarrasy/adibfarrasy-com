<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 265" role="img" aria-label="Where GPT-2 small&#x27;s 124 million parameters go: 38.6 million in the tied token embedding, 0.8 million in position embeddings, 85.1 million in twelve blocks. One block is one third attention and two thirds MLP." style="min-width:860px"><g class="ve-dim"><path class="ext" d="M20 50V42M920 50V42"/><path class="ln" d="M20 36H920"/><text x="470" y="28">124,439,808 parameters</text></g><rect class="ve-bar hot" x="20" y="58" width="279.17" height="34" rx="2" /><rect class="ve-bar" x="299.17" y="58" width="5.79" height="34" rx="2" /><rect class="ve-bar" x="304.96" y="58" width="615.48" height="34" rx="2" /><text class="ve-tick " x="159.59" y="112" >wte 38.6M, tied</text><text class="ve-tick " x="302.06" y="140" >wpe 0.8M</text><path class="ann" d="M302.06 92V126"/><text class="ve-tick " x="613.06" y="112" >12 blocks x 7.09M = 85.1M</text><path class="ve-grid" d="M304.96 150V190M920.43 150V190"/><rect class="ve-bar" x="304.96" y="190" width="204.87" height="34" rx="2" /><rect class="ve-bar hot" x="509.83" y="190" width="410.61" height="34" rx="2" /><text class="ve-tick " x="407.39" y="246" >attention 2.36M</text><text class="ve-tick " x="715.13" y="246" >MLP 4.72M (two thirds)</text><text class="ve-tick " x="130" y="212" style="text-anchor:middle">one block</text></svg></div><figcaption><span class="fig-n">Fig. 42</span>Where the 124M parameters go (you verify the total when the model loads). The embedding is counted once because the LM head shares it. A block is attention \(768\times2304 + 768\times768\) plus biases, MLP \(2\times768\times3072\) plus biases, and two LayerNorms.</figcaption></figure>
