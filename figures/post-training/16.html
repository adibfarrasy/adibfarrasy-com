<figure><div class="cases"><div class="case" data-st="warn"><span class="chip warn">Off-policy drift</span><h3>Offline DPO</h3><svg class="ve-mini" viewBox="0 0 240 150" role="img" aria-label="Other models feeds Fixed pairs, which feeds DPO."><g class="ve-n" transform="translate(10 4)"><rect class="sh" width="140" height="30" rx="6"/><text x="70.0" y="15.0">Other models</text></g><path class="ve-e" d="M80 34V58"/><text class="ve-el r" x="88" y="46">generate</text><g class="ve-n" transform="translate(10 58)"><rect class="sh" width="140" height="30" rx="6"/><text x="70.0" y="15.0">Fixed pairs</text></g><path class="ve-e" d="M80 88V112"/><text class="ve-el r" x="88" y="100">trains</text><g class="ve-n" transform="translate(10 112)"><rect class="sh" width="140" height="30" rx="6"/><text x="70.0" y="15.0">DPO</text></g></svg><p>The model learns to rank responses it would never produce.</p></div><div class="case"><span class="chip info">On-policy at the start</span><h3>On-policy DPO</h3><svg class="ve-mini" viewBox="0 0 240 150" role="img" aria-label="SFT model feeds Judge, which feeds DPO."><g class="ve-n" transform="translate(10 4)"><rect class="sh" width="140" height="30" rx="6"/><text x="70.0" y="15.0">SFT model</text></g><path class="ve-e" d="M80 34V58"/><text class="ve-el r" x="88" y="46">samples</text><g class="ve-n" transform="translate(10 58)"><rect class="sh" width="140" height="30" rx="6"/><text x="70.0" y="15.0">Judge</text></g><path class="ve-e" d="M80 88V112"/><text class="ve-el r" x="88" y="100">labels</text><g class="ve-n" transform="translate(10 112)"><rect class="sh" width="140" height="30" rx="6"/><text x="70.0" y="15.0">DPO</text></g></svg><p>Tulu 3 generates pairs once from its own SFT model.</p></div><div class="case" data-st="ok"><span class="chip ok">Closer to online</span><h3>Iterative DPO</h3><svg class="ve-mini" viewBox="0 0 240 150" role="img" aria-label="Model feeds Judge, which feeds DPO, and the result loops back."><g class="ve-n" transform="translate(10 4)"><rect class="sh" width="140" height="30" rx="6"/><text x="70.0" y="15.0">Model</text></g><path class="ve-e" d="M80 34V58"/><text class="ve-el r" x="88" y="46">samples</text><g class="ve-n" transform="translate(10 58)"><rect class="sh" width="140" height="30" rx="6"/><text x="70.0" y="15.0">Judge</text></g><path class="ve-e" d="M80 88V112"/><text class="ve-el r" x="88" y="100">labels</text><g class="ve-n" transform="translate(10 112)"><rect class="sh" width="140" height="30" rx="6"/><text x="70.0" y="15.0">DPO</text></g><path class="ve-e" d="M150 127H185V19H150"/><text class="ve-el r" x="193" y="73">again</text></svg><p>Llama 3 ran six rounds. PPO is fully online and slightly ahead when tuned.</p></div></div><figcaption><span class="fig-n">Fig. 16</span>Offline pairs go stale as the policy moves. Fresh samples let the method find and fix the current mistakes.</figcaption></figure>
