<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 800 215" role="img" aria-label="Mixtral 8x7B needs about 94 GB of bf16 weights but about 26 GFLOP per token, the same compute as a 13B dense model that needs about 26 GB."><text class="ve-tick l" x="0" y="35">memory, Mixtral 8x7B</text><rect class="ve-bar hot" x="230" y="20" width="440" height="26" rx="3"/><text class="ve-bar-v" x="680" y="33">≈ 94 GB</text><text class="ve-tick l" x="0" y="75">memory, 13B dense</text><rect class="ve-bar" x="230" y="60" width="122" height="26" rx="3"/><text class="ve-bar-v" x="362" y="73">≈ 26 GB</text><text class="ve-tick l" x="0" y="131">FLOPs, Mixtral 8x7B</text><rect class="ve-bar hot" x="230" y="116" width="121" height="26" rx="3"/><text class="ve-bar-v" x="361" y="129">≈ 26 GFLOP</text><text class="ve-tick l" x="0" y="171">FLOPs, 13B dense</text><rect class="ve-bar" x="230" y="156" width="122" height="26" rx="3"/><text class="ve-bar-v" x="362" y="169">≈ 26 GFLOP</text><text class="ve-tick l" x="230" y="200">bf16 weights at 2 bytes; FLOPs per token = 2 × active parameters</text></svg></div><figcaption><span class="fig-n">Fig. 18</span>Cheaper per token than a dense model of equal quality, but it needs more memory and more engineering to serve.</figcaption></figure>
