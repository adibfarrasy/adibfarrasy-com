<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 285" role="img" aria-label="The residual stream passes through early, middle and late blocks to the unembedding. The logit lens taps the stream after a middle block and applies the final norm and unembedding as if the model stopped there." style="min-width:860px"><g class="ve-n" transform="translate(20 100)" ><rect class="sh" width="90" height="60" rx="6"/><text x="45" y="19">Embed</text><text class="sub" x="45" y="41">(T, C)</text></g><g class="ve-n" transform="translate(170 100)" ><rect class="sh" width="170" height="60" rx="6"/><text x="85" y="19">Early blocks</text><text class="sub" x="85" y="41">local, syntax</text></g><g class="ve-n is-key" transform="translate(400 100)" ><rect class="sh" width="170" height="60" rx="6"/><text x="85" y="19">Middle blocks</text><text class="sub" x="85" y="41">facts, relations</text></g><g class="ve-n" transform="translate(630 100)" ><rect class="sh" width="170" height="60" rx="6"/><text x="85" y="19">Late blocks</text><text class="sub" x="85" y="41">exact next token</text></g><g class="ve-n" transform="translate(860 100)" ><rect class="sh" width="120" height="60" rx="6"/><text x="60" y="19">ln_f + W_U</text><text class="sub" x="60" y="41">(T, V)</text></g><path class="ve-e is-hot" d="M110 130H170" /><text class="ve-el " x="140" y="119" >adds</text><path class="ve-e is-hot" d="M340 130H400" /><text class="ve-el " x="370" y="119" >adds</text><path class="ve-e is-hot" d="M570 130H630" /><text class="ve-el " x="600" y="119" >adds</text><path class="ve-e is-hot" d="M800 130H860" /><text class="ve-el " x="830" y="119" >reads</text><path class="ve-e is-async" d="M485 160V213" /><g class="ve-n is-key" transform="translate(410 215)" ><rect class="sh" width="150" height="50" rx="6"/><text x="75" y="14">ln_f + W_U</text><text class="sub" x="75" y="36">as if it stopped</text></g><path class="ve-e " d="M560 240H640" /><text class="ve-el " x="600" y="229" >reads out</text><g class="ve-n" transform="translate(640 215)" ><rect class="sh" width="150" height="50" rx="6"/><text x="75" y="14">Guess</text><text class="sub" x="75" y="36">top tokens</text></g><text class="ve-el r" x="496" y="192" >tap the stream</text></svg></div><figcaption><span class="fig-n">Fig. 36</span>The residual stream: a d_model-wide channel per position that every layer reads from and adds to. Early layers handle local, surface features; middle layers carry most facts; late layers shape the exact output (tendencies, not boundaries). The logit lens reads any intermediate state with the final unembedding: the right answer typically emerges mid-stack and sharpens toward the end.</figcaption></figure>
