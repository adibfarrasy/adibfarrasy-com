<figure><div class="cases"><div class="case" data-st="risk"><span class="chip risk">Routing collapse</span><h3>A few experts win</h3><svg class="ve-mini" viewBox="0 0 240 130" role="img" aria-label="Load per expert: E1 takes almost everything, E2 to E4 starve."><rect class="ve-bar hot" x="20" y="20" width="40" height="80" rx="2"/><text class="ve-tick" x="40.0" y="120">E1</text><rect class="ve-bar" x="72" y="94" width="40" height="6" rx="2"/><text class="ve-tick" x="92.0" y="120">E2</text><rect class="ve-bar" x="124" y="94" width="40" height="6" rx="2"/><text class="ve-tick" x="144.0" y="120">E3</text><rect class="ve-bar" x="176" y="94" width="40" height="6" rx="2"/><text class="ve-tick" x="196.0" y="120">E4</text><path class="ve-grid" d="M10 100H230"/></svg><p>Better experts get more tokens, get better, and starve the rest. Dense model in a costume.</p></div><div class="case" data-st="warn"><span class="chip warn">Systems imbalance</span><h3>One GPU straggles</h3><svg class="ve-mini" viewBox="0 0 240 130" role="img" aria-label="Load per expert: E4 receives 5 times the tokens of each other expert."><rect class="ve-bar" x="20" y="84" width="40" height="16" rx="2"/><text class="ve-tick" x="40.0" y="120">E1</text><rect class="ve-bar" x="72" y="84" width="40" height="16" rx="2"/><text class="ve-tick" x="92.0" y="120">E2</text><rect class="ve-bar" x="124" y="84" width="40" height="16" rx="2"/><text class="ve-tick" x="144.0" y="120">E3</text><rect class="ve-bar hot" x="176" y="20" width="40" height="80" rx="2"/><text class="ve-tick" x="196.0" y="120">E4</text><path class="ve-grid" d="M10 100H230"/></svg><p>Experts live on different GPUs. At 5x its share, one expert makes every device wait.</p></div></div><figcaption><span class="fig-n">Fig. 3</span>Two failure modes drive most of the MoE literature.</figcaption></figure>
