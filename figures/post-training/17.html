<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 800 285" role="img" aria-label="A schematic of reward overoptimization. As KL from the reference grows, the proxy reward model score keeps rising, but the gold reward model score peaks and then falls."><path class="ve-grid" d="M80 30V240"/><path class="ve-grid" d="M80 240H720"/><path class="ve-e no-ah" d="M80 210C300 130 500 80 700 55"/><path class="ve-e no-ah is-hot" d="M80 210C200 140 300 95 400 92S560 130 700 215"/><text class="ve-el l" x="692" y="45">proxy RM score</text><text class="ve-el l" x="392" y="76">gold RM score</text><g class="ve-co" transform="translate(400 92)"><circle r="5"/></g><g class="ve-co" transform="translate(440 62)"><circle r="11"/><text>1</text></g><path class="ann" d="M405 88L431 69"/><text class="ve-tick" x="400" y="264">KL from the reference policy</text><text class="ve-tick l" x="20" y="22">reward score</text><text class="ve-tick l" x="520" y="22">schematic after Gao et al.</text></svg></div><figcaption><span class="fig-n">Fig. 17</span>Optimize a proxy hard enough and it stops tracking the real goal. The larger the KL, the worse the overoptimization.</figcaption><ol class="callouts"><li><span class="co-n">1</span>The gold score peaks, then falls. Symptoms: hedging, flattery, markdown everywhere, fabricated confidence.</li></ol></figure>
