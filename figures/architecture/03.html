<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 290" role="img" aria-label="Five input tokens go through the transformer once. Each position predicts the next token, so five targets are scored in the same pass." style="min-width:860px"><text class="ve-tick l" x="20" y="62" >inputs</text><text class="ve-tick l" x="20" y="222" >targets</text><g class="ve-n is-key" transform="translate(150 105)"><rect class="sh" width="810" height="50" rx="6"/><text x="405" y="25">Transformer with causal mask: position t sees only x1 ... xt</text></g><g class="ve-n" transform="translate(150 40)" ><rect class="sh" width="130" height="44" rx="6"/><text x="65" y="22">The</text></g><g class="ve-n" transform="translate(150 200)" ><rect class="sh" width="130" height="44" rx="6"/><text x="65" y="22">cat</text></g><path class="ve-e " d="M215 84V105" /><path class="ve-e is-hot" d="M215 155V198" /><g class="ve-n" transform="translate(318 40)" ><rect class="sh" width="130" height="44" rx="6"/><text x="65" y="22">cat</text></g><g class="ve-n" transform="translate(318 200)" ><rect class="sh" width="130" height="44" rx="6"/><text x="65" y="22">sat</text></g><path class="ve-e " d="M383 84V105" /><path class="ve-e is-hot" d="M383 155V198" /><g class="ve-n" transform="translate(486 40)" ><rect class="sh" width="130" height="44" rx="6"/><text x="65" y="22">sat</text></g><g class="ve-n" transform="translate(486 200)" ><rect class="sh" width="130" height="44" rx="6"/><text x="65" y="22">on</text></g><path class="ve-e " d="M551 84V105" /><path class="ve-e is-hot" d="M551 155V198" /><g class="ve-n" transform="translate(654 40)" ><rect class="sh" width="130" height="44" rx="6"/><text x="65" y="22">on</text></g><g class="ve-n" transform="translate(654 200)" ><rect class="sh" width="130" height="44" rx="6"/><text x="65" y="22">the</text></g><path class="ve-e " d="M719 84V105" /><path class="ve-e is-hot" d="M719 155V198" /><g class="ve-n" transform="translate(822 40)" ><rect class="sh" width="130" height="44" rx="6"/><text x="65" y="22">the</text></g><g class="ve-n" transform="translate(822 200)" ><rect class="sh" width="130" height="44" rx="6"/><text x="65" y="22">mat</text></g><path class="ve-e " d="M887 84V105" /><path class="ve-e is-hot" d="M887 155V198" /><text class="ve-el r" x="240" y="98" >reads</text><text class="ve-el r" x="240" y="178" >predicts x(t+1)</text><g class="ve-dim is-key"><path class="ext" d="M150 250V282M960 250V282"/><path class="ln" d="M150 276H960"/><text x="555" y="268">T inputs give T training examples in one pass</text></g></svg></div><figcaption><span class="fig-n">Fig. 3</span>Training is parallel across positions: a sequence of 1024 tokens gives 1024 examples at once. Generation is not: one forward pass per new token.</figcaption></figure>
