="28">÷ √v̂</text></g><g class="ve-n" transform="translate(710 200)"><rect class="sh" width="90" height="56" rx="6"/><text x="45" y="28">θ′</text></g><path class="ve-e" d="M90 228H172"/><text class="ve-el" x="131" y="216">reads</text><path class="ve-e" d="M262 228H345"/><text class="ve-el" x="303.5" y="216">feeds</text><path class="ve-e" d="M435 228H517"/><text class="ve-el" x="476" y="216">scales</text><path class="ve-e" d="M607 228H710"/><text class="ve-el" x="658.5" y="216">updates</text><text class="ve-tick" x="562" y="118">large v̂ divides the decay down</text><path class="ve-e is-hot" d="M45 256V288H755V258"/><text class="ve-el" x="400" y="280">decay −ηλθ, applied directly</text></svg></div><figcaption><span class="fig-n">Fig. 7</span>Where the λθ term enters decides who gets decayed. Through Adam's denominator, the decay depends on gradient history.</figcaption></figure>
