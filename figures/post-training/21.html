<figure><div class="cases"><div class="case" data-st="warn"><span class="chip warn">Over-refusal</span><h3>Benign, trigger word</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="A benign request with a trigger word is refused."><g class="ve-n" transform="translate(10 4)"><rect class="sh" width="220" height="34" rx="6"/><text x="110.0" y="17.0">kill a Python process</text></g><path class="ve-e is-st" d="M120 38V80"/><text class="ve-el r" x="128" y="59">refuses</text><g class="ve-n is-st" transform="translate(10 82)"><rect class="sh" width="220" height="34" rx="6"/><text x="110.0" y="17.0">No answer</text></g></svg><p>XSTest checks exactly this.</p></div><div class="case" data-st="risk"><span class="chip risk">Harmful compliance</span><h3>Harmful, complies</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="A harmful request is answered in detail."><g class="ve-n" transform="translate(10 4)"><rect class="sh" width="220" height="34" rx="6"/><text x="110.0" y="17.0">nerve agent synthesis</text></g><path class="ve-e is-st" d="M120 38V80"/><text class="ve-el r" x="128" y="59">explains</text><g class="ve-n is-st" transform="translate(10 82)"><rect class="sh" width="220" height="34" rx="6"/><text x="110.0" y="17.0">Step-by-step harm</text></g></svg><p>The failure everyone expects.</p></div><div class="case" data-st="ok"><span class="chip ok">Correct refusal</span><h3>Harmful, declines</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="A harmful request is declined briefly."><g class="ve-n" transform="translate(10 4)"><rect class="sh" width="220" height="34" rx="6"/><text x="110.0" y="17.0">nerve agent synthesis</text></g><path class="ve-e is-st" d="M120 38V80"/><text class="ve-el r" x="128" y="59">declines</text><g class="ve-n is-st" transform="translate(10 82)"><rect class="sh" width="220" height="34" rx="6"/><text x="110.0" y="17.0">Brief no</text></g></svg><p>Decline without lecturing.</p></div><div class="case" data-st="ok"><span class="chip ok">Safe completion</span><h3>Borderline</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="A borderline request gets help with the safe part only."><g class="ve-n" transform="translate(10 4)"><rect class="sh" width="220" height="34" rx="6"/><text x="110.0" y="17.0">borderline request</text></g><path class="ve-e is-st" d="M120 38V80"/><text class="ve-el r" x="128" y="59">helps</text><g class="ve-n is-st" transform="translate(10 82)"><rect class="sh" width="220" height="34" rx="6"/><text x="110.0" y="17.0">Safe part only</text></g></svg><p>Help with the safe part, decline specifics.</p></div></div><figcaption><span class="fig-n">Fig. 21</span>Train on borderline-but-benign prompts with helpful answers, not only harmful prompts with refusals. Measure harmful compliance and over-refusal.</figcaption></figure>
