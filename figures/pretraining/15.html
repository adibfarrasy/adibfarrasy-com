<figure><div class="cases"><div class="case" data-st="ok"><span class="chip ok">Exact</span><h3>Hash and keep one</h3><svg class="ve-mini" viewBox="0 0 240 124" role="img" aria-label="Exact dedup: two identical pages share a hash, so one is kept."><g class="ve-n" transform="translate(10 6)"><rect class="sh" width="100" height="34" rx="6"/><text x="50" y="17">page</text></g><g class="ve-n" transform="translate(130 6)"><rect class="sh" width="100" height="34" rx="6"/><text x="50" y="17">page</text></g><path class="ve-e is-st" d="M60 40L100 70"/><path class="ve-e is-st" d="M180 40L140 70"/><g class="ve-n is-st" transform="translate(35 72)"><rect class="sh" width="170" height="46" rx="6"/><text x="85" y="17">keep one</text><text class="sub" x="85" y="33.6">same hash</text></g></svg><p>Per document, line or paragraph. Line-level dedup removes repeated menus and cookie banners.</p></div><div class="case" data-st="warn"><span class="chip warn">Substring</span><h3>Suffix arrays</h3><svg class="ve-mini" viewBox="0 0 240 124" role="img" aria-label="Substring dedup: a long repeated span shared by two documents is cut."><g class="ve-n" transform="translate(10 6)"><rect class="sh" width="100" height="34" rx="6"/><text x="50" y="17">doc A</text></g><g class="ve-n" transform="translate(130 6)"><rect class="sh" width="100" height="34" rx="6"/><text x="50" y="17">doc B</text></g><path class="ve-e is-st" d="M60 40L100 70"/><path class="ve-e is-st" d="M180 40L140 70"/><g class="ve-n is-st" transform="translate(35 72)"><rect class="sh" width="170" height="46" rx="6"/><text x="85" y="17">cut the span</text><text class="sub" x="85" y="33.6">50+ tokens repeated</text></g></svg><p>Finds repeated spans across documents. Used for C4 cleanup; expensive.</p></div><div class="case" data-st="ok"><span class="chip ok">Fuzzy</span><h3>MinHash + LSH</h3><svg class="ve-mini" viewBox="0 0 240 124" role="img" aria-label="Fuzzy dedup: two near-identical articles have high Jaccard similarity, so one is dropped."><g class="ve-n" transform="translate(10 6)"><rect class="sh" width="100" height="34" rx="6"/><text x="50" y="17">article</text></g><g class="ve-n" transform="translate(130 6)"><rect class="sh" width="100" height="34" rx="6"/><text x="50" y="17">article+ad</text></g><path class="ve-e is-st" d="M60 40L100 70"/><path class="ve-e is-st" d="M180 40L140 70"/><g class="ve-n is-st" transform="translate(35 72)"><rect class="sh" width="170" height="46" rx="6"/><text x="85" y="17">drop one</text><text class="sub" x="85" y="33.6">J above ~0.75</text></g></svg><p>Near-duplicates: the same article with a different footer. Cheap enough for billions of pages.</p></div></div><figcaption><span class="fig-n">Fig. 15</span>Three granularities. FineWeb found that deduplicating across all 96 snapshots was worse than within each: global dedup kept unique junk and dropped good pages that were legitimately recrawled.</figcaption></figure>
