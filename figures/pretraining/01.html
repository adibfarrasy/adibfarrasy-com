<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 800 175" role="img" aria-label="Pipeline: raw web text is cleaned into a corpus, packed into token ids, and trained into a base model. Post-training then tunes the base model into a chat model. Pretraining spans the first four boxes."><path class="ve-e" d="M120 85H170"/><text class="ve-el" x="145" y="76">clean</text><path class="ve-e" d="M290 85H340"/><text class="ve-el" x="315" y="76">pack</text><path class="ve-e is-hot" d="M460 85H510"/><text class="ve-el" x="485" y="76">train</text><path class="ve-e is-async" d="M630 85H680"/><text class="ve-el" x="655" y="76">tune</text><g class="ve-n" transform="translate(0 50)"><rect class="sh" width="120" height="70" rx="6"/><text x="60" y="25.9">Raw web</text><text class="sub" x="60" y="51.1">petabytes</text></g><g class="ve-n" transform="translate(170 50)"><rect class="sh" width="120" height="70" rx="6"/><text x="60" y="25.9">Corpus</text><text class="sub" x="60" y="51.1">filtered</text></g><g class="ve-n" transform="translate(340 50)"><rect class="sh" width="120" height="70" rx="6"/><text x="60" y="25.9">Token ids</text><text class="sub" x="60" y="51.1">packed</text></g><g class="ve-n is-key" transform="translate(510 50)"><rect class="sh" width="120" height="70" rx="6"/><text x="60" y="25.9">Base model</text><text class="sub" x="60" y="51.1">weights</text></g><g class="ve-n" transform="translate(680 50)"><rect class="sh" width="120" height="70" rx="6"/><text x="60" y="25.9">Chat model</text><text class="sub" x="60" y="51.1">post-training</text></g><path class="ann" d="M145 62V36"/><g class="ve-co" transform="translate(145 24)"><circle r="11"/><text>1</text></g><path class="ann" d="M485 62V36"/><g class="ve-co" transform="translate(485 24)"><circle r="11"/><text>2</text></g><path class="ann" d="M570 50V36"/><g class="ve-co" transform="translate(570 24)"><circle r="11"/><text>3</text></g><path class="ann" d="M655 62V36"/><g class="ve-co" transform="translate(655 24)"><circle r="11"/><text>4</text></g><g class="ve-dim is-key"><path class="ext" d="M0 122V156M630 122V156"/><path class="ln" d="M0 150H630"/><text x="315" y="143">pretraining: most knowledge, most compute</text></g></svg></div><figcaption><span class="fig-n">Fig. 1</span>Pretraining turns raw text into a base model; post-training reshapes how that model behaves.</figcaption><ol class="callouts"><li><span class="co-n">1</span>Sections 03 and 04 cover data: filtering, deduplication, mixtures.</li><li><span class="co-n">2</span>Sections 02, 03 and 05 cover the loss, the size and the cluster.</li><li><span class="co-n">3</span>Sections 06 and 07 cover late stages and how to check progress.</li><li><span class="co-n">4</span>Post-training (next chapter) changes behavior, not capability.</li></ol></figure>
