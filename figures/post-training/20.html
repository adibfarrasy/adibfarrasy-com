<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 800 190" role="img" aria-label="The ReAct loop. A thought picks a tool. The action executes it. The observation feeds the next thought. When done, the thought leads to the answer."><g class="ve-n" transform="translate(20 70)"><rect class="sh" width="150" height="60" rx="6"/><text x="75.0" y="20.0">Thought</text><text class="sub" x="75.0" y="40.0">what do I need?</text></g><path class="ve-e" d="M170 100H260"/><text class="ve-el" x="215" y="88">picks tool</text><g class="ve-n is-key" transform="translate(260 70)"><rect class="sh" width="150" height="60" rx="6"/><text x="75.0" y="20.0">Action</text><text class="sub" x="75.0" y="40.0">tool call</text></g><path class="ve-e" d="M410 100H500"/><text class="ve-el" x="455" y="88">executes</text><g class="ve-n" transform="translate(500 70)"><rect class="sh" width="150" height="60" rx="6"/><text x="75.0" y="20.0">Observation</text><text class="sub" x="75.0" y="40.0">tool result</text></g><path class="ve-e is-hot" d="M575 130V170H95V134"/><text class="ve-el" x="335" y="158">feeds next thought</text><path class="ve-e" d="M95 70V32H730V70"/><text class="ve-el" x="412" y="20">when done</text><g class="ve-n" transform="translate(680 70)"><rect class="sh" width="100" height="60" rx="6"/><text x="50.0" y="30.0">Answer</text></g></svg></div><figcaption><span class="fig-n">Fig. 20</span>ReAct interleaves reasoning with actions. Observations ground the reasoning; reasoning plans the next action.</figcaption></figure>
