ve-bar hot" x="166" y="78" width="18" height="10" rx="2"/><text class="ve-tick" x="120" y="106">decoder writes the spans</text></svg><p>Spans (mean length 3) become sentinels &lt;X&gt;, &lt;Y&gt;; the decoder outputs the spans. Good for translation and summarization.</p></div></div><figcaption><span class="fig-n">Fig. 7</span>Decoder-only models won because every token trains, generation is native, and prompting covers understanding too.</figcaption></figure>
