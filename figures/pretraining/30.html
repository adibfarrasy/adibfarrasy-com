<figure><div class="cases"><div class="case" data-st="ok"><span class="chip ok">MMLU</span><h3>knowledge</h3><svg class="ve-mini" viewBox="0 0 240 124" role="img" aria-label="MMLU: a five-shot multiple-choice question ranked by option likelihood."><g class="ve-n" transform="translate(20 4)"><rect class="sh" width="200" height="50" rx="6"/><text x="100" y="18.5">5-shot question</text><text class="sub" x="100" y="36.5">57 subjects, 14K Qs</text></g><path class="ve-e is-st" d="M120 54V80"/><text class="ve-el r" x="128" y="72">scored by</text><g class="ve-n is-st" transform="translate(20 84)"><rect class="sh" width="200" height="34" rx="6"/><text x="100" y="17">rank 4 options</text></g></svg><p>14K four-way multiple-choice questions from high school to professional level. Knowledge breadth.</p></div><div class="case" data-st="ok"><span class="chip ok">HellaSwag</span><h3>commonsense</h3><svg class="ve-mini" viewBox="0 0 240 124" role="img" aria-label="HellaSwag: a scenario with four endings ranked by likelihood."><g class="ve-n" transform="translate(20 4)"><rect class="sh" width="200" height="50" rx="6"/><text x="100" y="18.5">short scenario</text><text class="sub" x="100" y="36.5">adversarially filtered</text></g><path class="ve-e is-st" d="M120 54V80"/><text class="ve-el r" x="128" y="72">scored by</text><g class="ve-n is-st" transform="translate(20 84)"><rect class="sh" width="200" height="34" rx="6"/><text x="100" y="17">rank 4 endings</text></g></svg><p>Pick the most plausible continuation. Saturates near 90%+ for strong models but very useful early.</p></div><div class="case" data-st="ok"><span class="chip ok">ARC</span><h3>science</h3><svg class="ve-mini" viewBox="0 0 240 124" role="img" aria-label="ARC: a science question with options ranked by likelihood."><g class="ve-n" transform="translate(20 4)"><rect class="sh" width="200" height="50" rx="6"/><text x="100" y="18.5">grade-school science</text><text class="sub" x="100" y="36.5">Easy and Challenge</text></g><path class="ve-e is-st" d="M120 54V80"/><text class="ve-el r" x="128" y="72">scored by</text><g class="ve-n is-st" transform="translate(20 84)"><rect class="sh" width="200" height="34" rx="6"/><text x="100" y="17">rank options</text></g></svg><p>Grade-school science multiple choice. Challenge has ~1,170 questions.</p></div><div class="case" data-st="warn"><span class="chip warn">GSM8K</span><h3>math</h3><svg class="ve-mini" viewBox="0 0 240 124" role="img" aria-label="GSM8K: a word problem solved by generation, scored by matching the final number."><g class="ve-n" transform="translate(20 4)"><rect class="sh" width="200" height="50" rx="6"/><text x="100" y="18.5">word problem</text><text class="sub" x="100" y="36.5">8.5K problems</text></g><path class="ve-e is-st" d="M120 54V80"/><text class="ve-el r" x="128" y="72">scored by</text><g class="ve-n is-st" transform="translate(20 84)"><rect class="sh" width="200" height="34" rx="6"/><text x="100" y="17">exact match on number</text></g></svg><p>Multi-step arithmetic; usually with chain-of-thought (8-shot).</p></div><div class="case" data-st="warn"><span class="chip warn">HumanEval</span><h3>code</h3><svg class="ve-mini" viewBox="0 0 240 124" role="img" aria-label="HumanEval: a function specification, generated code scored by running tests."><g class="ve-n" transform="translate(20 4)"><rect class="sh" width="200" height="50" rx="6"/><text x="100" y="18.5">function spec</text><text class="sub" x="100" y="36.5">164 Python problems</text></g><path class="ve-e is-st" d="M120 54V80"/><text class="ve-el r" x="128" y="72">scored by</text><g class="ve-n is-st" transform="translate(20 84)"><rect class="sh" width="200" height="34" rx="6"/><text x="100" y="17">run unit tests</text></g></svg><p>Reported as pass@1 (or pass@k).</p></div></div><figcaption><span class="fig-n">Fig. 30</span>The pretraining suite. Multiple-choice tasks are ranked by likelihood (cheap, stable); GSM8K and HumanEval need generation (realistic, noisier). Others: PIQA, WinoGrande, BoolQ, MATH, MBPP, BBH, DROP, TriviaQA, MMLU-Pro, GPQA.</figcaption></figure>
