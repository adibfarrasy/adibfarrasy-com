<figure><div class="cases"><div class="case" data-st="ok"><span class="chip ok">by token type</span><h3>ST-MoE encoder</h3><svg class="ve-mini" viewBox="0 0 240 110" role="img" aria-label="Punctuation goes to expert 1 and numbers to expert 2: clean split by token type."><path class="ve-e" d="M80 25H160"/><path class="ve-e" d="M80 85H160"/><g class="ve-n" transform="translate(10 7)"><rect class="sh" width="70" height="36" rx="6"/><text x="35" y="18">punct.</text></g><g class="ve-n" transform="translate(10 67)"><rect class="sh" width="70" height="36" rx="6"/><text x="35" y="18">number</text></g><g class="ve-n" transform="translate(160 7)"><rect class="sh" width="70" height="36" rx="6"/><text x="35" y="18">E1</text></g><g class="ve-n" transform="translate(160 67)"><rect class="sh" width="70" height="36" rx="6"/><text x="35" y="18">E2</text></g></svg><p>Experts split by token type: punctuation, proper nouns, verbs, numbers. Decoder experts specialized much less, and none split by language.</p></div><div class="case" data-st="warn"><span class="chip warn">no domain split</span><h3>Mixtral</h3><svg class="ve-mini" viewBox="0 0 240 110" role="img" aria-label="Both GitHub and ArXiv tokens go to both experts: no domain-level split."><path class="ve-e" d="M80 25H160"/><path class="ve-e" d="M80 25L160 85"/><path class="ve-e" d="M80 85L160 25"/><path class="ve-e" d="M80 85H160"/><g class="ve-n" transform="translate(10 7)"><rect class="sh" width="70" height="36" rx="6"/><text x="35" y="18">GitHub</text></g><g class="ve-n" transform="translate(10 67)"><rect class="sh" width="70" height="36" rx="6"/><text x="35" y="18">ArXiv</text></g><g class="ve-n" transform="translate(160 7)"><rect class="sh" width="70" height="36" rx="6"/><text x="35" y="18">E1</text></g><g class="ve-n" transform="translate(160 67)"><rect class="sh" width="70" height="36" rx="6"/><text x="35" y="18">E2</text></g></svg><p>No clear domain split across ArXiv, biology, philosophy, GitHub, math. Routing follows syntax: self in Python, indentation, consecutive tokens.</p></div><div class="case" data-st="ok"><span class="chip ok">by domain</span><h3>OLMoE</h3><svg class="ve-mini" viewBox="0 0 240 110" role="img" aria-label="ArXiv tokens concentrate on expert 1 and GitHub tokens on expert 2."><path class="ve-e" d="M80 25H160"/><path class="ve-e" d="M80 85H160"/><g class="ve-n" transform="translate(10 7)"><rect class="sh" width="70" height="36" rx="6"/><text x="35" y="18">ArXiv</text></g><g class="ve-n" transform="translate(10 67)"><rect class="sh" width="70" height="36" rx="6"/><text x="35" y="18">GitHub</text></g><g class="ve-n" transform="translate(160 7)"><rect class="sh" width="70" height="36" rx="6"/><text x="35" y="18">E1</text></g><g class="ve-n" transform="translate(160 67)"><rect class="sh" width="70" height="36" rx="6"/><text x="35" y="18">E2</text></g></svg><p>Clearer domain specialization and low co-activation, credited to fine-grained experts and training from scratch instead of upcycling.</p></div></div><figcaption><span class="fig-n">Fig. 16</span>Where tokens go, in three analyses. Do not expect a "math expert" or a "French expert".</figcaption></figure>
