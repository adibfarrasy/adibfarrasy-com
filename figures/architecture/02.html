<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 185" role="img" aria-label="Autoregressive loop: tokens so far feed the model, which scores every token; one token is picked and appended to the tokens so far." style="min-width:860px"><g class="ve-n" transform="translate(20 40)" ><rect class="sh" width="170" height="70" rx="6"/><text x="85" y="24">Tokens so far</text><text class="sub" x="85" y="46">x1 ... xt</text></g><g class="ve-n is-key" transform="translate(270 40)" ><rect class="sh" width="130" height="70" rx="6"/><text x="65" y="24">Model</text><text class="sub" x="65" y="46">forward pass</text></g><g class="ve-n" transform="translate(480 40)" ><rect class="sh" width="170" height="70" rx="6"/><text x="85" y="24">p(next)</text><text class="sub" x="85" y="46">one prob per token</text></g><g class="ve-n" transform="translate(730 40)" ><rect class="sh" width="150" height="70" rx="6"/><text x="75" y="24">Pick one</text><text class="sub" x="75" y="46">argmax or draw</text></g><path class="ve-e " d="M190 75H270" /><text class="ve-el " x="230" y="64" >feeds</text><path class="ve-e is-hot" d="M400 75H480" /><text class="ve-el " x="440" y="64" >scores</text><path class="ve-e " d="M650 75H730" /><text class="ve-el " x="690" y="64" >samples</text><path class="ve-e is-async" d="M805 110V160H105V112" /><text class="ve-el " x="455" y="150" >append the token, go back</text></svg></div><figcaption><span class="fig-n">Fig. 2</span>Autoregressive generation. There is no separate answer mode: a chat reply is a continuation of a document that looks like a conversation.</figcaption></figure>
