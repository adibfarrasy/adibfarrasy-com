<figure><div class="cases"><div class="case" data-st="ok"><span class="chip ok">Across nodes</span><h3>Data parallel (DP)</h3><svg class="ve-mini" viewBox="0 0 240 104" role="img" aria-label="Data parallelism: two GPUs hold full model copies and see different batches, then average gradients."><g class="ve-n" transform="translate(10 8)"><rect class="sh" width="100" height="50" rx="6"/><text x="50" y="18.5">model</text><text class="sub" x="50" y="36.5">batch A</text></g><g class="ve-n" transform="translate(130 8)"><rect class="sh" width="100" height="50" rx="6"/><text x="50" y="18.5">model</text><text class="sub" x="50" y="36.5">batch B</text></g><path class="ve-e no-ah is-st" d="M110 33H130"/><text class="ve-tick" x="120" y="90">all-reduce grads</text></svg><p>Full replica per GPU, 16 B per parameter each. Gradients are averaged after backward.</p></div><div class="case" data-st="warn"><span class="chip warn">Inside one node</span><h3>Tensor parallel (TP)</h3><svg class="ve-mini" viewBox="0 0 240 104" role="img" aria-label="Tensor parallelism: each GPU holds half of every weight matrix and the partial results are summed."><g class="ve-n" transform="translate(10 8)"><rect class="sh" width="100" height="50" rx="6"/><text x="50" y="18.5">W cols</text><text class="sub" x="50" y="36.5">GPU 0</text></g><g class="ve-n" transform="translate(130 8)"><rect class="sh" width="100" height="50" rx="6"/><text x="50" y="18.5">W cols</text><text class="sub" x="50" y="36.5">GPU 1</text></g><path class="ve-e no-ah is-st" d="M110 33H130"/><text class="ve-tick" x="120" y="90">all-reduce partials</text></svg><p>Split each matrix by columns, then rows. Two all-reduces per layer, so it needs NVLink-class bandwidth.</p></div><div class="case" data-st="warn"><span class="chip warn">Has a bubble</span><h3>Pipeline parallel (PP)</h3><svg class="ve-mini" viewBox="0 0 240 104" role="img" aria-label="Pipeline parallelism: GPU 0 holds the first layers, GPU 1 the next, and activations flow forward."><g class="ve-n" transform="translate(10 8)"><rect class="sh" width="100" height="50" rx="6"/><text x="50" y="18.5">L 1-16</text><text class="sub" x="50" y="36.5">GPU 0</text></g><g class="ve-n" transform="translate(130 8)"><rect class="sh" width="100" height="50" rx="6"/><text x="50" y="18.5">L 17-32</text><text class="sub" x="50" y="36.5">GPU 1</text></g><path class="ve-e is-st" d="M110 33H130"/><text class="ve-tick" x="120" y="90">sends activations</text></svg><p>Layers in stages, micro-batches flow through. Only neighbor traffic, so it crosses nodes.</p></div><div class="case" data-st="ok"><span class="chip ok">Long sequences</span><h3>Context parallel (CP)</h3><svg class="ve-mini" viewBox="0 0 240 104" role="img" aria-label="Context parallelism: each GPU holds a chunk of the sequence and passes keys and values around."><g class="ve-n" transform="translate(10 8)"><rect class="sh" width="100" height="50" rx="6"/><text x="50" y="18.5">tokens A</text><text class="sub" x="50" y="36.5">GPU 0</text></g><g class="ve-n" transform="translate(130 8)"><rect class="sh" width="100" height="50" rx="6"/><text x="50" y="18.5">tokens B</text><text class="sub" x="50" y="36.5">GPU 1</text></g><path class="ve-e no-ah is-st" d="M110 33H130"/><text class="ve-tick" x="120" y="90">pass K and V</text></svg><p>Split the sequence itself, including attention. Needed at 128K tokens.</p></div></div><figcaption><span class="fig-n">Fig. 21</span>Each strategy splits a different axis. Large runs combine them (3D or 4D parallelism): TP in a node, PP across a few nodes, CP for long sequences, FSDP or DP over the rest.</figcaption></figure>
