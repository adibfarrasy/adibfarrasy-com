<div class="ve-player">
<ol class="ve-cap">
<li data-n="1/4">Rollout: sample responses for a batch of prompts. This is the expensive part, run on an inference engine such as vLLM.</li>
<li data-n="2/4">Score: the reward model scores the response, the reference gives log-probs for the KL, and the critic gives a value at every token.</li>
<li data-n="3/4">Advantages: build per-token rewards with the KL folded in, then run GAE.</li>
<li data-n="4/4">Update: several epochs of minibatch PPO on the policy and value regression on the critic. Accent border means trained.</li>
</ol>
