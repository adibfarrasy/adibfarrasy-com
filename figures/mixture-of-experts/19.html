<figure><div class="cases"><div class="case" data-st="ok"><span class="chip ok">reads about 2 experts per layer</span><h3>Batch 1</h3><svg class="ve-mini" viewBox="0 0 240 110" role="img" aria-label="At batch size 1, one token reads 2 of 8 experts."><rect class="ve-bar" x="8" y="20" width="22" height="22" rx="2"/><rect class="ve-bar hot" x="36" y="20" width="22" height="22" rx="2"/><rect class="ve-bar" x="64" y="20" width="22" height="22" rx="2"/><rect class="ve-bar" x="92" y="20" width="22" height="22" rx="2"/><rect class="ve-bar" x="120" y="20" width="22" height="22" rx="2"/><rect class="ve-bar hot" x="148" y="20" width="22" height="22" rx="2"/><rect class="ve-bar" x="176" y="20" width="22" height="22" rx="2"/><rect class="ve-bar" x="204" y="20" width="22" height="22" rx="2"/><text class="ve-tick" x="120" y="74">reads 2 of 8</text></svg><p>Bytes read are about the active parameters, so decode is fast.</p></div><div class="case" data-st="risk"><span class="chip risk">reads nearly all experts</span><h3>Batch 256</h3><svg class="ve-mini" viewBox="0 0 240 110" role="img" aria-label="At batch size 256, tokens together hit all 8 experts."><rect class="ve-bar hot" x="8" y="20" width="22" height="22" rx="2"/><rect class="ve-bar hot" x="36" y="20" width="22" height="22" rx="2"/><rect class="ve-bar hot" x="64" y="20" width="22" height="22" rx="2"/><rect class="ve-bar hot" x="92" y="20" width="22" height="22" rx="2"/><rect class="ve-bar hot" x="120" y="20" width="22" height="22" rx="2"/><rect class="ve-bar hot" x="148" y="20" width="22" height="22" rx="2"/><rect class="ve-bar hot" x="176" y="20" width="22" height="22" rx="2"/><rect class="ve-bar hot" x="204" y="20" width="22" height="22" rx="2"/><text class="ve-tick" x="120" y="74">reads 8 of 8</text></svg><p>Different tokens hit different experts, so each step reads close to total parameters.</p></div></div><figcaption><span class="fig-n">Fig. 19</span>Decode is memory-bandwidth bound, so batching erodes the bandwidth advantage.</figcaption></figure>
