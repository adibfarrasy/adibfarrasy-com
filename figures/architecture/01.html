<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 215" role="img" aria-label="Text goes to the tokenizer, which splits it into token ids. The embedding turns ids into vectors with position. N transformer blocks mix and refine them. The LM head scores every vocabulary entry. The sampler picks one token, which is appended to the input and the loop repeats." style="min-width:860px"><g class="ve-n" transform="translate(20 60)" ><rect class="sh" width="110" height="70" rx="6"/><text x="55" y="24">Text</text><text class="sub" x="55" y="46">string</text></g><g class="ve-n" transform="translate(190 60)" ><rect class="sh" width="110" height="70" rx="6"/><text x="55" y="24">Tokenizer</text><text class="sub" x="55" y="46">BPE</text></g><g class="ve-n" transform="translate(360 60)" ><rect class="sh" width="110" height="70" rx="6"/><text x="55" y="24">Embedding</text><text class="sub" x="55" y="46">+ position</text></g><g class="ve-n" transform="translate(530 60)" ><rect class="sh" width="110" height="70" rx="6"/><text x="55" y="24">N × Block</text><text class="sub" x="55" y="46">attn + MLP</text></g><g class="ve-n" transform="translate(700 60)" ><rect class="sh" width="110" height="70" rx="6"/><text x="55" y="24">LM head</text><text class="sub" x="55" y="46">logits</text></g><g class="ve-n" transform="translate(870 60)" ><rect class="sh" width="110" height="70" rx="6"/><text x="55" y="24">Sampler</text><text class="sub" x="55" y="46">next token</text></g><path class="ve-e " d="M130 95H190" /><text class="ve-el " x="160" y="84" >splits</text><path class="ve-e " d="M300 95H360" /><text class="ve-el " x="330" y="84" >embeds</text><path class="ve-e" d="M470 95H530" /><text class="ve-el " x="500" y="84" >mixes</text><path class="ve-e" d="M640 95H700" /><text class="ve-el " x="670" y="84" >scores</text><path class="ve-e " d="M810 95H870" /><text class="ve-el " x="840" y="84" >picks</text><text class="ve-tick " x="245" y="154" >(T,) ids</text><text class="ve-tick " x="415" y="154" >(T, C)</text><text class="ve-tick " x="585" y="154" >(T, C)</text><text class="ve-tick " x="755" y="154" >(T, V)</text><path class="ve-e is-async" d="M925 130V200H75V132" /><text class="ve-el " x="500" y="190" >appends the token, repeats</text><path class="ann" d="M245 60V46"/><g class="ve-co" transform="translate(245 34)" ><circle r="11"/><text>1</text></g><path class="ann" d="M415 60V46"/><g class="ve-co" transform="translate(415 34)" ><circle r="11"/><text>2</text></g><path class="ann" d="M585 60V46"/><g class="ve-co" transform="translate(585 34)" ><circle r="11"/><text>3</text></g><path class="ann" d="M925 60V46"/><g class="ve-co" transform="translate(925 34)" ><circle r="11"/><text>4</text></g></svg></div><figcaption><span class="fig-n">Fig. 1</span>A language model maps a token sequence to one score per vocabulary entry. Shapes under each box are what it outputs.</figcaption><ol class="callouts"><li><span class="co-n">1</span>Section 02 opens the tokenizer.</li><li><span class="co-n">2</span>Sections 03 and 04 open the embedding and position.</li><li><span class="co-n">3</span>Sections 05 and 06 open attention, the MLP, and the block.</li><li><span class="co-n">4</span>Section 07 builds it and samples from it.</li></ol></figure>
