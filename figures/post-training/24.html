<figure class="ve-steps"><div class="frame"><svg class="ve-svg" viewBox="0 0 800 215" role="img" aria-label="Tulu 3 recipe: data, then SFT on 939 thousand prompts, then DPO on 354 thousand pairs, then RLVR with PPO and verifiers. An evaluation framework steers every stage."><g class="ve-dim is-key" data-s="1"><path class="ext" d="M10 150V194 M789 150V194"/><path class="ln" d="M10 190H789"/><text x="399.5" y="183">Tulu 3 Eval (OLMES) steers every stage</text></g><g class="ve-n" data-s="2" transform="translate(10 60)"><rect class="sh" width="140" height="80" rx="6"/><text x="70.0" y="20.0">Data</text><text class="sub" x="70.0" y="40.0">prompt pool</text><text class="sub" x="70.0" y="60.0">persona-driven</text></g><g class="ve-n" data-s="3" transform="translate(223 60)"><rect class="sh" width="140" height="80" rx="6"/><text x="70.0" y="20.0">SFT</text><text class="sub" x="70.0" y="40.0">939k prompts</text><text class="sub" x="70.0" y="60.0">lr 5e-6 · 2 ep</text></g><path class="ve-e" data-s="3" pathLength="1" d="M150 100H223"/><text class="ve-el" data-s="3" x="186.5" y="88">trains</text><g class="ve-n" data-s="4" transform="translate(436 60)"><rect class="sh" width="140" height="80" rx="6"/><text x="70.0" y="20.0">DPO</text><text class="sub" x="70.0" y="40.0">354k pairs</text><text class="sub" x="70.0" y="60.0">β=5 · lr 5e-7</text></g><path class="ve-e" data-s="4" pathLength="1" d="M363 100H436"/><text class="ve-el" data-s="4" x="399.5" y="88">samples</text><g class="ve-n is-key" data-s="5" transform="translate(649 60)"><rect class="sh" width="140" height="80" rx="6"/><text x="70.0" y="20.0">RLVR</text><text class="sub" x="70.0" y="40.0">PPO + verifiers</text><text class="sub" x="70.0" y="60.0">α=10 · β≈0.05</text></g><path class="ve-e" data-s="5" pathLength="1" d="M576 100H649"/><text class="ve-el" data-s="5" x="612.5" y="88">starts</text></svg></div><div class="ve-player"><ol class="ve-cap"><li data-n="1/5">Fix target skills first, then build Tulu 3 Eval with a development set and an unseen set.</li><li data-n="2/5">Curate prompts: public sets plus persona-driven synthetic math, code and instruction-following prompts, decontaminated against the evals.</li><li data-n="3/5">SFT on about 939k examples: learning rate \(5\times10^{-6}\), 2 epochs, batch 128, max length 4,096, 3% warmup.</li><li data-n="4/5">On-policy, length-normalized DPO on about 354k pairs: \(\beta = 5\), learning rate \(5\times10^{-7}\) for 8B, 1 epoch.</li><li data-n="5/5">RLVR with PPO from the DPO checkpoint: reward 10 when a verifier passes, KL \(\beta\) around 0.05 for 8B.</li></ol><button data-go="-1" aria-label="Previous step">&larr;</button><button data-play>Play</button><input type="range" min="0" value="0" aria-label="Step"><button data-go="1" aria-label="Next step">&rarr;</button></div><figcaption><span class="fig-n">Fig. 24</span>Four parts, one evaluation spine. Hyperparameters are the 8B settings.</figcaption></figure>
