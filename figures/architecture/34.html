<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 290" role="img" aria-label="Standard attention writes and reads the full n by n score and probability matrices to slow HBM memory. FlashAttention keeps tiles in fast on-chip SRAM, using an online softmax, and writes only the output." style="min-width:860px"><text class="ve-tick l" x="20" y="20" >STANDARD: the n x n matrix makes four trips through HBM</text><g class="ve-n" transform="translate(20 40)" ><rect class="sh" width="100" height="56" rx="6"/><text x="50" y="28">Q K^T</text></g><g class="ve-n is-key" transform="translate(190 40)" ><rect class="sh" width="130" height="56" rx="6"/><text x="65" y="17">S in HBM</text><text class="sub" x="65" y="39">n x n</text></g><g class="ve-n" transform="translate(390 40)" ><rect class="sh" width="110" height="56" rx="6"/><text x="55" y="28">softmax</text></g><g class="ve-n is-key" transform="translate(570 40)" ><rect class="sh" width="130" height="56" rx="6"/><text x="65" y="17">P in HBM</text><text class="sub" x="65" y="39">n x n</text></g><g class="ve-n" transform="translate(770 40)" ><rect class="sh" width="100" height="56" rx="6"/><text x="50" y="28">P · V</text></g><path class="ve-e is-hot" d="M120 68H190" /><text class="ve-el " x="155" y="57" >writes</text><path class="ve-e " d="M320 68H390" /><text class="ve-el " x="355" y="57" >reads</text><path class="ve-e is-hot" d="M500 68H570" /><text class="ve-el " x="535" y="57" >writes</text><path class="ve-e " d="M700 68H770" /><text class="ve-el " x="735" y="57" >reads</text><text class="ve-tick l" x="20" y="150" >FLASHATTENTION: same exact result, tiles stay in fast SRAM</text><g class="ve-zone"><rect x="200" y="172" width="520" height="100" rx="8"/><text x="212" y="194">SRAM</text></g><g class="ve-n" transform="translate(215 200)" ><rect class="sh" width="120" height="50" rx="6"/><text x="60" y="25">QK^T tile</text></g><g class="ve-n is-key" transform="translate(385 200)" ><rect class="sh" width="140" height="50" rx="6"/><text x="70" y="25">online softmax</text></g><g class="ve-n" transform="translate(570 200)" ><rect class="sh" width="100" height="50" rx="6"/><text x="50" y="25">P · V tile</text></g><path class="ve-e " d="M335 225H385" /><path class="ve-e " d="M525 225H570" /><g class="ve-n" transform="translate(20 200)" ><rect class="sh" width="130" height="50" rx="6"/><text x="65" y="14">Q, K, V</text><text class="sub" x="65" y="36">HBM</text></g><path class="ve-e " d="M150 225H213" /><text class="ve-el " x="182" y="214" >reads</text><g class="ve-n" transform="translate(790 200)" ><rect class="sh" width="130" height="50" rx="6"/><text x="65" y="14">O</text><text class="sub" x="65" y="36">HBM</text></g><path class="ve-e " d="M672 225C730 225 730 225 788 225" /><text class="ve-el " x="730" y="214" >writes</text></svg></div><figcaption><span class="fig-n">Fig. 34</span>FlashAttention (Dao et al., 2022) is exact. The online softmax keeps a running max and sum of exponentials and rescales the partial output when a new max appears. Memory drops from \(O(n^2)\) to \(O(n)\) and it runs 2 to 4 times faster, but FLOPs stay \(O(n^2)\). In PyTorch: <code>F.scaled_dot_product_attention</code>.</figcaption></figure>
