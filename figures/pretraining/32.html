<figure><div class="cases"><div class="case" data-st="ok"><span class="chip ok">Cloze (CF)</span><h3>Score the answer text</h3><svg class="ve-mini" viewBox="0 0 240 124" role="img" aria-label="Cloze: the model scores the answer text."><g class="ve-n" transform="translate(20 6)"><rect class="sh" width="200" height="34" rx="6"/><text x="100" y="17">capital of France is</text></g><path class="ve-e is-st" d="M120 40V66"/><text class="ve-el r" x="128" y="58">score text</text><g class="ve-n is-st" transform="translate(20 70)"><rect class="sh" width="96" height="40" rx="6"/><text x="48" y="20">Paris</text></g><g class="ve-n is-st" transform="translate(124 70)"><rect class="sh" width="96" height="40" rx="6"/><text x="48" y="20">Rome</text></g></svg><p>Works for small models. Smooth signal.</p></div><div class="case" data-st="warn"><span class="chip warn">Multiple choice (MCF)</span><h3>Score the letter</h3><svg class="ve-mini" viewBox="0 0 240 124" role="img" aria-label="Multiple choice: options are labeled A to D and the model scores the letter."><g class="ve-n" transform="translate(20 6)"><rect class="sh" width="200" height="34" rx="6"/><text x="100" y="17">A Rome  B Paris</text></g><path class="ve-e is-st" d="M120 40V66"/><text class="ve-el r" x="128" y="58">score letter</text><g class="ve-n is-st" transform="translate(20 70)"><rect class="sh" width="200" height="40" rx="6"/><text x="100" y="20">B</text></g></svg><p>Small models sit at chance because they have not learned the format; large models do better. Switching formulations mid-project creates fake jumps.</p></div></div><figcaption><span class="fig-n">Fig. 32</span>Same question, two formulations. MMLU at 25% for a small model may mean it does not know the A/B/C/D format, so try cloze.</figcaption></figure>
