<figure class="ve-steps"><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 200" role="img" aria-label="The residual stream x runs left to right. Norm 1 reads a copy, attention adds its output to the stream. Norm 2 reads the result, the MLP adds its output." style="min-width:860px"><text class="ve-tick " x="250" y="50" data-s="1">x</text><text class="ve-tick " x="685" y="50" data-s="3">x' = x + Attn(Norm 1(x))</text><text class="ve-tick " x="950" y="50" data-s="5">x''</text><g class="ve-n" transform="translate(20 45)" data-s="1"><rect class="sh" width="70" height="50" rx="6"/><text x="35" y="14">x</text><text class="sub" x="35" y="36">(T, C)</text></g><path class="ve-e is-hot no-ah" d="M90 70H448" data-s="1" pathLength="1"/><path class="ve-e is-hot no-ah" d="M492 70H878" data-s="3" pathLength="1"/><path class="ve-e is-hot" d="M922 70H975" data-s="5" pathLength="1"/><path class="ve-e " d="M115 70V150H145" data-s="2" pathLength="1"/><text class="ve-el r" x="122" y="112" data-s="2">reads</text><g class="ve-n" transform="translate(145 125)" data-s="2"><rect class="sh" width="100" height="50" rx="6"/><text x="50" y="25">Norm 1</text></g><path class="ve-e " d="M245 150H285" data-s="3" pathLength="1"/><g class="ve-n is-key" transform="translate(285 125)" data-s="3"><rect class="sh" width="120" height="50" rx="6"/><text x="60" y="14">Attn</text><text class="sub" x="60" y="36">mixes tokens</text></g><path class="ve-e " d="M405 150H470V92" data-s="3" pathLength="1"/><text class="ve-el r" x="478" y="118" data-s="3">adds</text><g class="ve-n" transform="translate(448 48)" data-s="3"><rect class="sh" width="44" height="44" rx="6"/><text x="22" y="22">+</text></g><path class="ve-e " d="M515 70V150H545" data-s="4" pathLength="1"/><text class="ve-el r" x="522" y="112" data-s="4">reads</text><g class="ve-n" transform="translate(545 125)" data-s="4"><rect class="sh" width="100" height="50" rx="6"/><text x="50" y="25">Norm 2</text></g><path class="ve-e " d="M645 150H685" data-s="4" pathLength="1"/><g class="ve-n is-key" transform="translate(685 125)" data-s="4"><rect class="sh" width="150" height="50" rx="6"/><text x="75" y="14">MLP</text><text class="sub" x="75" y="36">each token alone</text></g><path class="ve-e " d="M835 150H900V92" data-s="5" pathLength="1"/><text class="ve-el r" x="908" y="118" data-s="5">adds</text><g class="ve-n" transform="translate(878 48)" data-s="5"><rect class="sh" width="44" height="44" rx="6"/><text x="22" y="22">+</text></g></svg></div><div class="ve-player"><ol class="ve-cap"><li data-n="1/5">The residual stream \(x\) enters the block with shape \((T, C)\).</li><li data-n="2/5">Norm 1 reads a normalized copy of \(x\). The stream itself is not changed.</li><li data-n="3/5">Attention reads the copy and mixes information across positions. Its output is added back: \(x' = x + \text{Attn}(\text{Norm}_1(x))\).</li><li data-n="4/5">Norm 2 reads \(x'\). The MLP transforms each position on its own.</li><li data-n="5/5">The MLP output is added: \(x'' = x' + \text{MLP}(\text{Norm}_2(x'))\). Same shape, ready for the next block.</li></ol><button data-go="-1" aria-label="Previous step">←</button><button data-play>Play</button><input type="range" min="0" value="0" aria-label="Step"><button data-go="1" aria-label="Next step">→</button></div><figcaption><span class="fig-n">Fig. 35</span>One transformer block. Every intermediate keeps the shape (T, C).</figcaption></figure>
