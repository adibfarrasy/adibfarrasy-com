<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 800 175" role="img" aria-label="Bytes moved per all-to-all grow in proportion to k: 1x, 2x, 4x, 8x for k equal to 1, 2, 4, 8."><text class="ve-tick l" x="0" y="31">k = 1</text><rect class="ve-bar" x="100" y="20" width="40" height="22" rx="2"/><text class="ve-bar-v" x="150" y="31">1x</text><text class="ve-tick l" x="0" y="67">k = 2</text><rect class="ve-bar" x="100" y="56" width="80" height="22" rx="2"/><text class="ve-bar-v" x="190" y="67">2x</text><text class="ve-tick l" x="0" y="103">k = 4</text><rect class="ve-bar" x="100" y="92" width="160" height="22" rx="2"/><text class="ve-bar-v" x="270" y="103">4x</text><text class="ve-tick l" x="0" y="139">k = 8</text><rect class="ve-bar hot" x="100" y="128" width="320" height="22" rx="2"/><text class="ve-bar-v" x="430" y="139">8x</text><text class="ve-tick l" x="100" y="166">bytes sent per token, relative to k = 1</text></svg></div><figcaption><span class="fig-n">Fig. 11</span>Doubling k doubles the bytes moved. Expert optimizer states shard naturally, so EP composes with ZeRO on the dense parts.</figcaption></figure>
