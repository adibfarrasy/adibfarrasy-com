<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 1000 320" role="img" aria-label="Input X is split across h attention heads, each of width 64. Their outputs are concatenated back to width C and mixed by W_O." style="min-width:860px"><g class="ve-n" transform="translate(20 115)" ><rect class="sh" width="100" height="60" rx="6"/><text x="50" y="19">X</text><text class="sub" x="50" y="41">(T, C)</text></g><g class="ve-n" transform="translate(200 25)" ><rect class="sh" width="150" height="50" rx="6"/><text x="75" y="14">head 1</text><text class="sub" x="75" y="36">(T, 64)</text></g><path class="ve-e " d="M120 145C160 145 160 50 200 50" /><path class="ve-e " d="M350 50C400 50 400 145 450 145" /><g class="ve-n" transform="translate(200 100)" ><rect class="sh" width="150" height="50" rx="6"/><text x="75" y="14">head 2</text><text class="sub" x="75" y="36">(T, 64)</text></g><path class="ve-e " d="M120 145C160 145 160 125 200 125" /><path class="ve-e " d="M350 125C400 125 400 145 450 145" /><g class="ve-n" transform="translate(200 225)" ><rect class="sh" width="150" height="50" rx="6"/><text x="75" y="14">head 12</text><text class="sub" x="75" y="36">(T, 64)</text></g><path class="ve-e " d="M120 145C160 145 160 250 200 250" /><path class="ve-e " d="M350 250C400 250 400 145 450 145" /><text class="ve-el " x="160" y="90" >splits</text><text class="ve-tick " x="275" y="192" >...</text><text class="ve-el " x="400" y="100" >stacks</text><g class="ve-n" transform="translate(450 115)" ><rect class="sh" width="130" height="60" rx="6"/><text x="65" y="19">Concat</text><text class="sub" x="65" y="41">(T, C)</text></g><g class="ve-n is-key" transform="translate(650 115)" ><rect class="sh" width="130" height="60" rx="6"/><text x="65" y="19">W_O</text><text class="sub" x="65" y="41">(C, C)</text></g><g class="ve-n" transform="translate(850 115)" ><rect class="sh" width="130" height="60" rx="6"/><text x="65" y="19">output</text><text class="sub" x="65" y="41">(T, C)</text></g><path class="ve-e is-hot" d="M580 145H650" /><text class="ve-el " x="615" y="134" >mixes</text><path class="ve-e is-hot" d="M780 145H850" /><text class="ve-el " x="815" y="134" >emits</text><text class="ve-tick l" x="20" y="306" >each head has its own W_Q, W_K, W_V of width d_k = C / h. GPT-2 small: h = 12, d_k = 64.</text></svg></div><figcaption><span class="fig-n">Fig. 29</span>Multi-head attention. One pattern expresses one kind of relationship; heads run in parallel so a token can read the previous token, the subject and the matching bracket at once. Total cost is about the same as one full-width head.</figcaption></figure>
