<figure><div class="frame"><svg class="ve-svg" viewBox="0 0 800 286" role="img" aria-label="Trajectories of a singular value under the Newton-Schulz polynomial for four starting values. Starting values 0.1, 0.5 and 1 reach the band 0.7 to 1.2 within a few iterations; 0.001 is still below it after five."><g class="ve-zone"><rect x="130" y="50.9" width="610" height="74.6"/><text x="138" y="44.9">band 0.7 to 1.2</text></g><path class="ve-grid" d="M130 230H740"/><path class="ve-e no-ah" d="M130 229.9L252 229.5L374 228.2L496 223.9L618 209L740 159.8"/><path class="ve-e no-ah is-hot" d="M130 215.1L252 179.3L374 81.9L496 124.5L618 64.9L740 123.7"/><path class="ve-e no-ah is-hot" d="M130 155.4L252 52.6L374 96.3L496 107L618 90L740 115.8"/><path class="ve-e no-ah is-hot" d="M130 80.8L252 125.4L374 63.8L496 122.4L618 67.3L740 126.1"/><text class="ve-el l" x="120" y="85.8">σ₀ = 1</text><text class="ve-el l" x="120" y="160.4">σ₀ = 0.5</text><text class="ve-el l" x="120" y="220.1">σ₀ = 0.1</text><text class="ve-el l" x="120" y="237.1">σ₀ = 0.001</text><text class="ve-tick" x="130" y="252">0</text><text class="ve-tick" x="252" y="252">1</text><text class="ve-tick" x="374" y="252">2</text><text class="ve-tick" x="496" y="252">3</text><text class="ve-tick" x="618" y="252">4</text><text class="ve-tick" x="740" y="252">5</text><text class="ve-tick" x="435" y="276">Newton-Schulz iteration k</text></svg></div><figcaption><span class="fig-n">Fig. 15</span>Why not SVD? Newton-Schulz needs only matmuls, so it runs in bf16 at a few percent overhead. The odd polynomial pushes each singular value toward a band around 1, not exactly to 1; tiny ones converge slowly.</figcaption></figure>
