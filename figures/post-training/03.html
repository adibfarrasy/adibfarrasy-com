<figure class="ve-steps"><div class="frame"><svg class="ve-svg" viewBox="0 0 800 290" role="img" aria-label="InstructGPT in three steps. About 13k human demonstrations train an SFT model. Labelers rank outputs for 33k prompts and train a 6B reward model. PPO on 31k prompts uses the reward model, with a KL penalty to the SFT model. The 1.3B result beats the 175B base in labeler preference."><g class="ve-n" data-s="1" transform="translate(20 30)"><rect class="sh" width="150" height="60" rx="6"/><text x="75.0" y="20.0">13k prompts</text><text class="sub" x="75.0" y="40.0">human demos</text></g><path class="ve-e" data-s="1" pathLength="1" d="M170 60H250"/><text class="ve-el" data-s="1" x="210" y="48">imitates</text><g class="ve-n" data-s="1" transform="translate(250 30)"><rect class="sh" width="150" height="60" rx="6"/><text x="75.0" y="30.0">SFT model</text></g><g class="ve-n" data-s="2" transform="translate(20 120)"><rect class="sh" width="150" height="60" rx="6"/><text x="75.0" y="20.0">33k prompts</text><text class="sub" x="75.0" y="40.0">4 to 9 ranked</text></g><path class="ve-e" data-s="2" pathLength="1" d="M170 150H250"/><text class="ve-el" data-s="2" x="210" y="138">trains</text><g class="ve-n" data-s="2" transform="translate(250 120)"><rect class="sh" width="150" height="60" rx="6"/><text x="75.0" y="20.0">Reward model</text><text class="sub" x="75.0" y="40.0">6B</text></g><g class="ve-n" data-s="3" transform="translate(20 210)"><rect class="sh" width="150" height="60" rx="6"/><text x="75.0" y="30.0">31k prompts</text></g><path class="ve-e" data-s="3" pathLength="1" d="M170 240H250"/><text class="ve-el" data-s="3" x="210" y="228">samples</text><g class="ve-n is-key" data-s="3" transform="translate(250 210)"><rect class="sh" width="150" height="60" rx="6"/><text x="75.0" y="20.0">PPO policy</text><text class="sub" x="75.0" y="40.0">InstructGPT</text></g><path class="ve-e is-hot" data-s="3" pathLength="1" d="M325 180V210"/><text class="ve-el r" data-s="3" x="333" y="198">scores</text><path class="ve-e" data-s="3" pathLength="1" d="M400 60H450V228H400"/><text class="ve-el r" data-s="3" x="458" y="140">KL leash</text><g class="ve-n" data-s="3" transform="translate(570 210)"><rect class="sh" width="190" height="60" rx="6"/><text x="95.0" y="20.0">Pretraining mix</text><text class="sub" x="95.0" y="40.0">optional</text></g><path class="ve-e" data-s="3" pathLength="1" d="M570 255H400"/><text class="ve-el" data-s="3" x="485" y="243">mixes in</text><text class="ve-tick l" data-s="4" x="560" y="46">parameters</text><text class="ve-tick l" data-s="4" x="560" y="70">GPT-3 base</text><rect class="ve-bar" data-s="4" x="560" y="80" width="190" height="16" rx="2"/><text class="ve-bar-v" data-s="4" x="758" y="88">175B</text><text class="ve-tick l" data-s="4" x="560" y="130">InstructGPT</text><rect class="ve-bar hot" data-s="4" x="560" y="140" width="1.4" height="16" rx="2"/><text class="ve-bar-v" data-s="4" x="568" y="148">1.3B</text><text class="ve-tick l" data-s="4" x="560" y="176">preferred by labelers</text></svg></div><div class="ve-player"><ol class="ve-cap"><li data-n="1/4">SFT: about 13k prompts with human-written demonstrations.</li><li data-n="2/4">Reward model: labelers rank 4 to 9 outputs for about 33k prompts; a 6B model learns the ranking.</li><li data-n="3/4">PPO: about 31k prompts scored by the reward model. A KL penalty keeps the policy near the SFT model; PPO-ptx also mixes in pretraining gradients.</li><li data-n="4/4">Result: labelers preferred the 1.3B InstructGPT model over the 175B GPT-3 base model.</li></ol><button data-go="-1" aria-label="Previous step">&larr;</button><button data-play>Play</button><input type="range" min="0" value="0" aria-label="Step"><button data-go="1" aria-label="Next step">&rarr;</button></div><figcaption><span class="fig-n">Fig. 3</span>InstructGPT is the template. A 100x smaller model won on the metric users care about.</figcaption></figure>
