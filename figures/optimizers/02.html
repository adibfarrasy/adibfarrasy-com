<figure><div class="cases"><div class="case" data-st="risk"><span class="chip risk">Ill-conditioning</span><h3>Steep one way, flat the other</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="Elliptical loss contours, with a path that zigzags across the narrow direction while advancing slowly along the long one."><ellipse class="ann" cx="120" cy="62" rx="105" ry="34" fill="none"/><ellipse class="ann" cx="120" cy="62" rx="60" ry="19" fill="none"/><path class="ve-e is-st" d="M30 20L48 100L66 26L84 94L102 36L120 80L138 56"/><text class="ve-el" x="190" y="112">zigzags</text></svg><p>A step small enough for the steep direction crawls along the flat one.</p></div><div class="case" data-st="warn"><span class="chip warn">Noise</span><h3>A minibatch is only an estimate</h3><svg class="ve-mini" viewBox="0 0 240 120" role="img" aria-label="From one point, the true gradient arrow and three scattered minibatch gradient arrows around it."><g class="ve-n" transform="translate(0 78)"><rect class="sh" width="60" height="36" rx="6"/><text x="30" y="18">θ</text></g><path class="ve-e is-st" d="M60 96L210 22"/><text class="ve-el" x="150" y="44">true g</text><path class="ve-e" d="M60 100L205 70"/><path class="ve-e" d="M60 96L170 12"/><path class="ve-e" d="M60 102L225 52"/><text class="ve-el" x="160" y="112">minibatch g</text></svg><p>Following g blindly spends steps on noise.</p></div></div><figcaption><span class="fig-n">Fig. 2</span>Two reasons plain gradient descent struggles. Every optimizer here is a different answer to both.</figcaption></figure>
