<figure class="ve-steps"><div class="frame"><svg class="ve-svg" viewBox="0 0 800 345" role="img" aria-label="Sequence between the model, the runtime and a tool. The runtime puts tool schemas in the prompt. The model emits a call and stops. The runtime executes the tool, gets the result, and appends it as a tool message. The model then calls again or answers."><path class="ve-grid" d="M130 54V345"/><path class="ve-grid" d="M400 54V345"/><path class="ve-grid" d="M670 54V345"/><g class="ve-n is-key" transform="translate(55 10)"><rect class="sh" width="150" height="44" rx="6"/><text x="75.0" y="22.0">Model</text></g><g class="ve-n" transform="translate(325 10)"><rect class="sh" width="150" height="44" rx="6"/><text x="75.0" y="22.0">Runtime</text></g><g class="ve-n" transform="translate(595 10)"><rect class="sh" width="150" height="44" rx="6"/><text x="75.0" y="22.0">Tool or API</text></g><path class="ve-e" data-s="1" pathLength="1" d="M400 100H130"/><text class="ve-el" data-s="1" x="265" y="88">schemas in prompt</text><path class="ve-e is-hot" data-s="2" pathLength="1" d="M130 150H400"/><text class="ve-el" data-s="2" x="265" y="138">emits call, then stops</text><path class="ve-e" data-s="3" pathLength="1" d="M400 200H670"/><text class="ve-el" data-s="3" x="535" y="188">executes</text><path class="ve-e" data-s="3" pathLength="1" d="M670 228H400"/><text class="ve-el" data-s="3" x="535" y="216">returns result</text><path class="ve-e" data-s="3" pathLength="1" d="M400 270H130"/><text class="ve-el" data-s="3" x="265" y="258">appends tool message</text><path class="ve-e is-hot" data-s="4" pathLength="1" d="M130 320H400"/><text class="ve-el" data-s="4" x="265" y="308">calls again or answers</text></svg></div><div class="ve-player"><ol class="ve-cap"><li data-n="1/4">The runtime serializes tool names, descriptions and JSON-schema arguments into the prompt, usually in the system turn.</li><li data-n="2/4">The model emits a tool call, typically JSON inside special markers, and stops. This is all the model does.</li><li data-n="3/4">The runtime parses the call, executes it, and appends the result as a tool-role message (Llama 3 uses an ipython role).</li><li data-n="4/4">The model continues, conditioned on the result. It calls more tools or answers.</li></ol><button data-go="-1" aria-label="Previous step">&larr;</button><button data-play>Play</button><input type="range" min="0" value="0" aria-label="Step"><button data-go="1" aria-label="Next step">&rarr;</button></div><figcaption><span class="fig-n">Fig. 18</span>Function calling in four steps. Orange arrows are the only parts the model generates; security lives in the runtime.</figcaption></figure>
