<figure class="ve-steps"><div class="frame"><svg class="ve-svg" viewBox="0 0 920 330" style="min-width:791px" role="img" aria-label="The token hidden state x goes through a linear router to logits h, then softmax gives probabilities p. TopK picks 2 experts, whose outputs are weighted by gates g and summed to y. Gradient flows back to the router only through the gates of the picked experts."><g class="ve-n" transform="translate(10 100)" data-s="1"><rect class="sh" width="80" height="60" rx="6"/><text x="40" y="22.2">x</text><text class="sub" x="40" y="43.8">hidden</text></g><g class="ve-n" transform="translate(160 100)" data-s="1"><rect class="sh" width="110" height="60" rx="6"/><text x="55" y="22.2">W_r x</text><text class="sub" x="55" y="43.8">linear</text></g><g class="ve-n" transform="translate(340 100)" data-s="2"><rect class="sh" width="110" height="60" rx="6"/><text x="55" y="22.2">softmax</text><text class="sub" x="55" y="43.8">p</text></g><g class="ve-n is-key" transform="translate(520 100)" data-s="3"><rect class="sh" width="90" height="60" rx="6"/><text x="45" y="22.2">TopK</text><text class="sub" x="45" y="43.8">k = 2</text></g><g class="ve-n is-key" transform="translate(720 20)" data-s="3 4"><rect class="sh" width="90" height="50" rx="6"/><text x="45" y="25">FFN 1</text></g><g class="ve-n" transform="translate(720 100)" data-s="3"><rect class="sh is-off" width="90" height="50" rx="6"/><text x="45" y="25">FFN 2</text></g><g class="ve-n is-key" transform="translate(720 180)" data-s="3 4"><rect class="sh" width="90" height="50" rx="6"/><text x="45" y="25">FFN 3</text></g><g class="ve-n" transform="translate(850 100)" data-s="4"><rect class="sh" width="60" height="60" rx="6"/><text x="30" y="22.2">y</text><text class="sub" x="30" y="43.8">sum</text></g><path class="ve-e" data-s="1" pathLength="1" d="M90 130H160"/><text class="ve-el" data-s="1" x="125" y="120">feeds</text><path class="ve-e" data-s="1" pathLength="1" d="M270 130H340"/><text class="ve-el" data-s="1" x="305" y="120">emits h</text><path class="ve-e" data-s="2" pathLength="1" d="M450 130H520"/><text class="ve-el" data-s="2" x="485" y="120">gives p</text><path class="ve-e" data-s="3" pathLength="1" d="M610 130H665V45H720"/><path class="ve-e" data-s="3" pathLength="1" d="M610 130H665V205H720"/><text class="ve-el" data-s="3" x="637" y="121">top-k</text><path class="ve-e is-hot" data-s="4" pathLength="1" d="M810 45H830V130H850"/><path class="ve-e is-hot" data-s="4" pathLength="1" d="M810 205H830V130H850"/><text class="ve-el" data-s="4" x="830" y="33">× g</text><path class="ve-e is-hot is-async" data-s="5" d="M880 160V300H215V160"/><text class="ve-el" data-s="5" x="548" y="290">gradient reaches W_r only through picked gates</text></svg></div><div class="ve-player"><ol class="ve-cap"><li data-n="1/5">The router is one linear map. It scores every expert: h = W_r x.</li><li data-n="2/5">Softmax turns the E logits into probabilities p.</li><li data-n="3/5">TopK keeps the k best experts. The others never run for this token.</li><li data-n="4/5">Each chosen expert runs. Their outputs are scaled by the gates g and summed into y, which joins the residual stream.</li><li data-n="5/5">Backward pass: TopK has no gradient for which experts won. The router learns only through g of the experts it tried, which is why collapse happens.</li></ol><button data-go="-1" aria-label="Previous step">←</button><button data-play>Play</button><input type="range" min="0" value="0" aria-label="Step"><button data-go="1" aria-label="Next step">→</button></div><figcaption><span class="fig-n">Fig. 4</span>One token, one layer: the router picks, the gates weight, the sum replaces the dense FFN. Attention, norms and embeddings stay dense.</figcaption></figure>
